<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">

  <title>Personalemøde — storskærm</title>

  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{ color-scheme: light; }

    *{ margin:0; padding:0; box-sizing:border-box; }

    html, body{
      width:100%;
      height:100%;
      overflow:hidden;
    }

    body{
      font-family:'Archivo', sans-serif;
      background:var(--papir);
      color:var(--blaek);
      display:flex;
      flex-direction:column;
    }

    /* ---- Topbjælke ---- */

    #topbjaelke{
      display:flex;
      align-items:center;
      justify-content:space-between;
      flex-shrink:0;
      padding:20px 40px;
      border-bottom:2px solid var(--blaek);
    }

    #topbjaelke .eyebrow{ font-size:14px; }

    #moedeDato{
      font-size:16px;
      font-weight:700;
      color:var(--tekst-2);
      text-transform:uppercase;
      letter-spacing:.05em;
    }

    /* ---- Indhold ---- */

    #indhold{
      flex:1;
      min-height:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:40px;
    }

    /* ---- Rolig tilstand ---- */

    #roligTilstand{
      text-align:center;
    }

    #roligTitel{
      font-size:clamp(32px, 4vw, 56px);
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.03em;
    }

    #roligDato{
      margin-top:14px;
      font-size:clamp(18px, 2vw, 26px);
      font-weight:600;
      color:var(--tekst-2);
    }

    #roligUndertekst{
      margin-top:28px;
      font-size:clamp(14px, 1.4vw, 18px);
      color:var(--tom);
      text-transform:uppercase;
      letter-spacing:.08em;
      font-weight:700;
    }

    /* ---- Aktiv tilstand ---- */

    #aktivTilstand{
      width:100%;
      max-width:1400px;
      display:flex;
      flex-direction:column;
      gap:24px;
      min-height:0;
    }

    .highlight-badge{
      display:inline-block;
      padding:6px 16px;
      border-radius:20px;
      font-size:clamp(13px, 1.3vw, 18px);
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.08em;
      color:#fff;
    }

    .highlight-badge.beslutning{ background:var(--hl-beslutning); }
    .highlight-badge.opgave{ background:var(--guld); color:var(--blaek); }
    .highlight-badge.info{ background:var(--hl-info); }
    .highlight-badge.til_naeste{ background:var(--brand); }

    /* ---- Nu-blok ---- */

    .nu-block{
      background:var(--blaek);
      color:#fff;
      border-radius:16px;
      padding:clamp(28px, 4vw, 56px);
    }

    .nu-tekst{
      margin-top:20px;
      font-size:clamp(34px, 5.2vw, 76px);
      font-weight:800;
      line-height:1.15;
    }

    .nu-meta{
      margin-top:22px;
      display:flex;
      gap:32px;
      flex-wrap:wrap;
      font-size:clamp(18px, 2.4vw, 34px);
      font-weight:700;
      color:var(--guld);
    }

    /* ---- Tidligere highlights ---- */

    #tidligereListe{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));
      gap:16px;
    }

    .tidligere-kort{
      background:var(--flade);
      border-radius:10px;
      padding:18px 20px;
    }

    .tidligere-tekst{
      margin-top:10px;
      font-size:clamp(16px, 1.6vw, 22px);
      font-weight:700;
      color:var(--blaek);
      line-height:1.25;
    }

    .tidligere-meta{
      margin-top:8px;
      font-size:clamp(12px, 1.1vw, 15px);
      font-weight:600;
      color:var(--tekst-2);
    }
  </style>
</head>
<body>

<!-- ============================================================ -->
<!-- KONFIGURATION                                                 -->
<!-- ============================================================ -->
<script>
  const SUPABASE_URL = 'https://lumxvqhlmokspqnazhso.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx1bXh2cWhsbW9rc3BxbmF6aHNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwMzc3NTMsImV4cCI6MjA5OTYxMzc1M30.WvVrbqZWaY1V-6sC4XwoYDOciBULeCxcnxvB7TlAMno';

  // Client-side polling hvert 5. sekund — kortere end de 60 sek. i
  // søskende-projekterne, fordi highlights skal føles live under mødet.
  // Ingen server-side triggers, ingen Supabase Realtime-subscriptions
  // (bevidst valg for hele personalemoede-v2, se CLAUDE.md).
  const POLL_INTERVAL_MS = 5000;
</script>

<script src="supabase-js.min.js"></script>

<header id="topbjaelke">
  <div class="eyebrow">Personalemøde</div>
  <div id="moedeDato"></div>
</header>

<main id="indhold">

  <div id="roligTilstand" style="display:none;">
    <div id="roligTitel">Personalemøde</div>
    <div id="roligDato"></div>
    <div id="roligUndertekst"></div>
  </div>

  <div id="aktivTilstand" style="display:none;">
    <div id="nuBlock" class="nu-block">
      <span id="nuBadge" class="highlight-badge"></span>
      <div id="nuTekst" class="nu-tekst"></div>
      <div id="nuMeta" class="nu-meta"></div>
    </div>
    <div id="tidligereListe"></div>
  </div>

</main>

<!-- ============================================================ -->
<!-- SCRIPT                                                        -->
<!-- ============================================================ -->
<script>

let sb = null;
try {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
} catch (e) {
  console.error('Kunne ikke oprette Supabase-klient:', e);
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str == null ? '' : str;
  return d.innerHTML;
}

const UGEDAGE = ['Søndag','Mandag','Tirsdag','Onsdag','Torsdag','Fredag','Lørdag'];

function datoLangLabel(datoStr){
  if(!datoStr) return '';
  const d = new Date(datoStr + 'T00:00:00');
  if(isNaN(d.getTime())) return '';
  const ugedag = UGEDAGE[d.getDay()];
  const dag = String(d.getDate()).padStart(2,'0');
  const maaned = String(d.getMonth()+1).padStart(2,'0');
  return ugedag + ' ' + dag + '/' + maaned;
}

function datoKortLabel(datoStr){
  if(!datoStr) return '';
  const d = new Date(datoStr + 'T00:00:00');
  if(isNaN(d.getTime())) return '';
  return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0');
}

function tidKortLabel(tidStr){
  if(!tidStr) return '';
  return tidStr.toString().slice(0,5);
}

const HIGHLIGHT_TYPE_LABELS = {
  beslutning: 'Beslutning',
  opgave: 'Opgave',
  info: 'Info',
  til_naeste: 'Til næste møde'
};

function visKun(id){
  ['roligTilstand','aktivTilstand'].forEach(s => {
    document.getElementById(s).style.display = (s === id) ? (s === 'aktivTilstand' ? 'flex' : 'block') : 'none';
  });
}

function highlightMetaHtml(h){
  if(h.type !== 'opgave') return '';
  let html = '<span>Ansvarlig: ' + escapeHtml(h.ansvarlig || '') + '</span>';
  if(h.deadline) html += '<span>Deadline: ' + escapeHtml(datoKortLabel(h.deadline)) + '</span>';
  return html;
}

function visRoligTilstand(moede){
  document.getElementById('roligDato').textContent = moede
    ? (datoLangLabel(moede.dato) + (moede.starttid ? ' kl. ' + tidKortLabel(moede.starttid) : ''))
    : '';
  document.getElementById('roligUndertekst').textContent = moede
    ? 'Ingen highlights endnu'
    : 'Intet møde planlagt';
  visKun('roligTilstand');
}

function visAktivTilstand(highlights){
  const nyeste = highlights[0];
  const tidligere = highlights.slice(1, 5);

  const badge = document.getElementById('nuBadge');
  badge.className = 'highlight-badge ' + nyeste.type;
  badge.textContent = HIGHLIGHT_TYPE_LABELS[nyeste.type] || nyeste.type;

  document.getElementById('nuTekst').textContent = nyeste.tekst;
  document.getElementById('nuMeta').innerHTML = highlightMetaHtml(nyeste);

  const container = document.getElementById('tidligereListe');
  if(tidligere.length === 0){
    container.innerHTML = '';
  } else {
    let html = '';
    tidligere.forEach(h => {
      html += '<div class="tidligere-kort">' +
        '<span class="highlight-badge ' + h.type + '">' + escapeHtml(HIGHLIGHT_TYPE_LABELS[h.type] || h.type) + '</span>' +
        '<div class="tidligere-tekst">' + escapeHtml(h.tekst) + '</div>' +
        (h.type === 'opgave' ? '<div class="tidligere-meta">' + highlightMetaHtml(h).replace(/<\/?span>/g, ' ').trim() + '</div>' : '') +
        '</div>';
    });
    container.innerHTML = html;
  }

  visKun('aktivTilstand');
}

async function pollSkaerm(){
  if(!sb) return;

  const moedeRes = await sb
    .from('moeder')
    .select('*')
    .in('status', ['planlagt','igang'])
    .order('dato', { ascending: true })
    .order('starttid', { ascending: true })
    .limit(1);

  if(moedeRes.error){ console.error('Fejl moeder:', moedeRes.error); return; }

  const moede = (moedeRes.data && moedeRes.data.length > 0) ? moedeRes.data[0] : null;

  if(!moede){
    document.getElementById('moedeDato').textContent = '';
    visRoligTilstand(null);
    return;
  }

  document.getElementById('moedeDato').textContent =
    datoLangLabel(moede.dato) + (moede.starttid ? ' kl. ' + tidKortLabel(moede.starttid) : '');

  if(moede.status !== 'igang'){
    visRoligTilstand(moede);
    return;
  }

  const hlRes = await sb
    .from('highlights')
    .select('*')
    .eq('moede_id', moede.id)
    .eq('vist_paa_skaerm', true)
    .order('oprettet_at', { ascending: false })
    .limit(5);

  if(hlRes.error){ console.error('Fejl highlights:', hlRes.error); return; }

  const highlights = hlRes.data || [];
  if(highlights.length === 0){
    visRoligTilstand(moede);
    return;
  }

  visAktivTilstand(highlights);
}

pollSkaerm();
setInterval(pollSkaerm, POLL_INTERVAL_MS);

</script>

</body>
</html>
