<style>
  *{ box-sizing:border-box; }

  body{
    margin:0;
    font-family:'Archivo', sans-serif;
    background:var(--papir);
    color:var(--blaek);
    height:100vh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  h1,h2,h3{ font-family:'Fraunces', serif; margin:0; }

  /* ---- Topbjælke ---- */

  #topbjælke{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    flex-shrink:0;
    font-size:22px;
    font-weight:700;
    padding:14px 20px;
    border-bottom:2px solid var(--blaek);
  }

  /* ---- Overskrift: dagnavn vender, streg tegnes (kun transform/opacity) ---- */

  #overskrift{ position:relative; line-height:1.3; }

  /* Fast højde + overflow:hidden → layoutet hopper aldrig under vendingen. */
  #dagVindue{
    display:inline-block;
    vertical-align:bottom;
    overflow:hidden;
    height:1.3em;
    line-height:1.3;
  }

  #overskriftDag{ display:inline-block; line-height:inherit; will-change:transform, opacity; }

  #overskriftDag.dagUd{ animation:dagUd .3s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  #overskriftDag.dagInd{ animation:dagInd .4s cubic-bezier(0.2, 0.8, 0.2, 1) both; }

  @keyframes dagUd{
    from{ transform:translateY(0);     opacity:1; }
    to  { transform:translateY(-100%); opacity:0; }
  }
  @keyframes dagInd{
    from{ transform:translateY(100%); opacity:0; }
    to  { transform:translateY(0);    opacity:1; }
  }

  /* Stregen ligger i topbjælkens eksisterende polstring (påvirker ikke højden). */
  #overskriftStreg{
    position:absolute;
    left:0; right:0; bottom:-8px;
    height:3px;
    background:var(--guld);
    transform-origin:left center;
    transform:scaleX(0);
    will-change:transform;
  }
  #overskriftStreg.tegn{ animation:tegnStreg .6s cubic-bezier(0.2, 0.8, 0.2, 1) both; }

  @keyframes tegnStreg{
    from{ transform:scaleX(0); }
    to  { transform:scaleX(1); }
  }

  /* Reduceret bevægelse: ingen animation, stregen står færdigtegnet. */
  @media (prefers-reduced-motion: reduce){
    #overskriftDag.dagUd, #overskriftDag.dagInd, #overskriftStreg.tegn{ animation:none; }
    #overskriftStreg{ transform:scaleX(1); }
  }

  #topHøjreInfo{
    display:flex;
    align-items:baseline;
    gap:20px;
  }

  #vejrMini{
    display:flex;
    align-items:baseline;
    gap:6px;
    font-size:15px;
    font-weight:700;
    color:var(--tekst-2);
  }

  #vejrIkon{ font-size:20px; }
  #vejrBeskrivelse{ font-weight:500; }

  #ur{
    font-size:34px;
    font-weight:800;
    font-variant-numeric:tabular-nums;
    color:var(--blaek);
  }

  /* ---- Layout ---- */

  #layout{
    display:grid;
    grid-template-columns:73% 27%;
    flex:1;
    min-height:0;
    padding:16px 20px;
    gap:20px;
  }

  #venstre{
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    gap:20px;
    min-height:0;
  }

  #højre{
    display:flex;
    flex-direction:column;
    gap:12px;
    min-height:0;
  }

  .niveau .eyebrow{ margin-bottom:10px; }

  .niveau:not(:first-child){
    border-top:1px solid var(--streg);
    padding-top:20px;
  }

  /* ---- Niveau 1: I huset nu ---- */

  /* Altid ÉN række med lige store kort: hvert kort er højst 170 px bredt
     (ét kort strækker sig aldrig over hele rækken), men de krymper
     ligeligt sammen i stedet for at ombryde, når der er mange. */
  #gulv{
    display:grid;
    grid-auto-flow:column;
    grid-auto-columns:minmax(0, 170px);
    justify-content:start;
    gap:18px;
  }

  #gulv .tom-tilstand{ white-space:nowrap; }

  .personKort{ min-width:0; }

  .personKort .portræt{
    height:130px;
    border-radius:5px;
    overflow:hidden;
    background:var(--tekst-2);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .personKort .portræt img{ width:100%; height:100%; object-fit:cover; }

  .personKort .initialer{
    color:#fff;
    font-size:40px;
    font-weight:700;
  }

  .personKort.erDøgnvagt .portræt{
    outline:4px solid var(--guld);
    outline-offset:-4px;
  }

  .personKort .navn{
    font-size:21px; font-weight:800; margin-top:8px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }

  .personKort .tid{ font-size:14px; font-weight:700; color:var(--tekst-2); }

  .personKort.erDøgnvagt .tid{
    color:var(--guld-moerk);
    text-transform:uppercase;
    font-size:12px;
    font-weight:800;
  }

  /* ---- Niveau 2: Andre funktioner ---- */

  #funktionerRække{ display:flex; flex-wrap:wrap; gap:10px; }

  .funktionKort{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--flade);
    border-radius:6px;
    padding:8px 14px;
  }

  .funktionKort img, .funktionKort .initialerLille{
    width:42px; height:42px; border-radius:50%; flex-shrink:0;
  }

  .funktionKort .navn{ font-size:19px; font-weight:800; }

  .funktionKort .rolle{
    font-size:11.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.12em;
    color:var(--tekst-2);
  }

  /* ---- Niveau 3: Senere i dag ---- */

  #senereRække{ display:flex; flex-wrap:wrap; gap:14px; align-items:stretch; }

  .senereGruppe{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--flade);
    border-radius:6px;
    padding:8px 16px 8px 14px;
  }

  .senereGruppeLabel{
    font-family:'Archivo', sans-serif;
    font-size:11px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.1em;
    color:var(--tekst-2);
    white-space:nowrap;
    padding-right:12px;
    border-right:1px solid var(--streg);
  }

  .senereGruppePersoner{ display:flex; flex-wrap:wrap; gap:14px; }

  .senereItem{ display:flex; align-items:center; gap:8px; }

  .senereItem img, .senereItem .initialerLille{
    width:40px; height:40px; border-radius:50%; flex-shrink:0;
  }

  .senereItem .navn{ font-size:15px; font-weight:700; }

  /* ---- Fælles: rundt fallback-portræt med initialer (niveau 2/3) ---- */

  .initialerLille{
    background:var(--tekst-2);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    font-weight:700;
  }

  /* ---- Højre kolonne ---- */

  #aftensmad{
    background:var(--brand);
    color:#fff;
    border-radius:6px;
    padding:16px 18px;
    text-align:center;
    flex-shrink:0;
  }

  #aftensmad .eyebrow{ color:var(--guld); }

  #aftensmadRet{ font-size:29px; font-weight:800; color:#fff; margin-top:6px; }

  #aktivitetBoks{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    background:#fff;
    border:1px solid var(--streg);
    border-radius:6px;
    padding:16px 18px;
    overflow:hidden;
  }

  .slide{ display:none; flex-direction:column; height:100%; min-height:0; }
  .slide.vis{ display:flex; }

  .slide .titel{ font-size:25px; font-weight:800; margin-bottom:10px; flex-shrink:0; }

  #aktivitetBilledeBoks{
    flex:1;
    min-height:0;
    border-radius:6px;
    overflow:hidden;
    background:var(--flade);
  }

  #aktivitetBilledeBoks img{ width:100%; height:100%; object-fit:cover; display:block; }

  .ugensMadGrid{ display:grid; grid-template-columns:1fr 1fr; gap:0 20px; overflow-y:auto; }
  .ugensMadRække{ padding:6px 0; border-bottom:1px solid var(--streg-svag); font-size:14px; }
  .ugensMadRække .dag{ font-weight:700; color:var(--blaek); }

  .tom-tilstand{ margin:0; }
</style>
</head>

<script>

// ==================================================================
// SUPABASE-KLIENT (defensiv init, samme mønster som de to andre skærme)
// ==================================================================

let sb = null;
try {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
} catch (e) {
  console.error('Kunne ikke oprette Supabase-klient:', e);
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str == null ? '' : str;
  return d.innerHTML;
}

const UGEDAGE = ['Søndag','Mandag','Tirsdag','Onsdag','Torsdag','Fredag','Lørdag'];

// ==================================================================
// SKÆRM-INDSTILLINGER — hentes ved start og ved hver polling (60 sek.).
// Alt starter som aktiv=true (fail-safe: kan tabellen ikke læses, eller
// før første hentning er nået, vises alt som normalt).
// ==================================================================

let beboerskaermAktiv = {
  niveau1: true, niveau2: true, niveau3: true,
  aftensmad: true, aktivitet: true, madplan: true, vejr: true
};

async function hentBeboerskaermIndstillinger(){
  if(!sb) return;

  const { data, error } = await sb
    .from('skaerm_indstillinger')
    .select('noegle, aktiv')
    .eq('skaerm', 'beboerskaerm');

  // Fail-safe: kan indstillingerne ikke hentes, røres beboerskaermAktiv
  // ikke — skærmen bliver ved med at vise det den senest fik at vide
  // (eller alt, hvis dette er første hentning).
  if(error){ console.error('Fejl skaerm_indstillinger:', error); return; }
  if(!data) return;

  data.forEach(r => { beboerskaermAktiv[r.noegle] = r.aktiv; });
  anvendBeboerskaermIndstillinger();
}

function anvendBeboerskaermIndstillinger(){
  document.getElementById('niveau1').style.visibility = beboerskaermAktiv.niveau1 ? 'visible' : 'hidden';
  document.getElementById('niveau2').style.visibility = beboerskaermAktiv.niveau2 ? 'visible' : 'hidden';
  document.getElementById('niveau3').style.visibility = beboerskaermAktiv.niveau3 ? 'visible' : 'hidden';
  document.getElementById('aftensmad').style.visibility = beboerskaermAktiv.aftensmad ? 'visible' : 'hidden';
  document.getElementById('vejrMini').style.visibility = beboerskaermAktiv.vejr ? 'visible' : 'hidden';

  // aktivitet/madplan deler én fælles kasse (aktivitetBoks) og skiftes
  // mellem i karrusellen — et slukket modul må aldrig kunne vises der.
  slides = [];
  if(beboerskaermAktiv.aktivitet) slides.push('aktivitetSlide');
  if(beboerskaermAktiv.madplan) slides.push('madplanSlide');
  // `!(slideIndex < slides.length)` fanger også NaN (fx efter en periode
  // med slides.length===0, hvor modulo-intervallet nedenfor giver NaN).
  if(!(slideIndex < slides.length)) slideIndex = 0;
  visSlide();
}

// ==================================================================
// Rolle-visningsnavne — rå Workfeed-rolle gemmes i databasen af
// workfeed-sync, men VISES med samme omdøbning som den oprindelige
// hentPersonale() i Kode.js. "Rådighedsvagt" (rå) → "Døgnvagt" (vist) —
// filtrering nedenfor sker altid på det VISTE navn, matcher gammel logik.
// ==================================================================

function visningsRolle(raaRolle, tag){
  // Admin-tagget vagt i Workfeed = personen sidder på kontor den dag,
  // uanset deres almindelige rolle — skal vises i "Andre funktioner",
  // ikke som almindeligt gulv-personale.
  if(tag === 'Admin') return 'Kontor';
  if(tag === 'P-møde' || tag === 'P-møde m. vagt') return raaRolle === 'Rådighedsvagt' ? 'Døgnvagt' : (rolleTabel[raaRolle] || raaRolle);
  const tabel = {
    'Daglig leder': 'Leder',
    'Køkkenpersonale': 'Køkken',
    'Pedel': 'Pedel',
    'Vågen nattevagt': 'Nattevagt',
    'Socialfaglig medarbejder': 'Medarbejder',
    'SSA': 'Medicinvagt',
    'Rådighedsvagt': 'Døgnvagt'
  };
  return tabel[raaRolle] || raaRolle;
}
const rolleTabel = {
  'Daglig leder': 'Leder', 'Køkkenpersonale': 'Køkken', 'Pedel': 'Pedel',
  'Vågen nattevagt': 'Nattevagt', 'Socialfaglig medarbejder': 'Medarbejder',
  'SSA': 'Medicinvagt', 'Rådighedsvagt': 'Døgnvagt'
};

// ==================================================================
// Dag-omslag kl. 19:30 — client-side klok-check, IKKE en Apps
// Script-trigger (som var upræcis nok til at være en dokumenteret
// læring på tværs af alle tre Møllebakken-projekter). Genberegnes ved
// hvert poll, så der ikke er nogen "trigger" der kan ramme forkert.
// Gælder KUN personale-listen — madplan og aktivitet skifter først
// ved midnat, se dagensDato().
// ==================================================================

function skalViseImorgen(){
  const nu = new Date();
  return nu.getHours() > 19 || (nu.getHours() === 19 && nu.getMinutes() >= 30);
}

function måldato(){
  const nu = new Date();
  if(skalViseImorgen()) nu.setDate(nu.getDate() + 1);
  return nu;
}

function dagensDato(){
  return new Date();
}

function datoISO(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

// ==================================================================
// OVERSKRIFT-ANIMATION — dagnavnet vender, derefter tegnes en streg.
// Kører KUN når teksten faktisk ændrer sig (og ved første indlæsning);
// det samme kald hvert minut gør ingenting. Kun transform/opacity.
// ==================================================================

let sidsteOverskrift = null;
let overskriftSkift = 0;   // tæller: et nyt skift afbryder et igangværende

function sætOverskrift(tekst){
  if(tekst === sidsteOverskrift) return;
  const forste = sidsteOverskrift === null;
  sidsteOverskrift = tekst;

  const dag = document.getElementById('overskriftDag');
  const streg = document.getElementById('overskriftStreg');
  const skift = ++overskriftSkift;

  const reduceret = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduceret){
    dag.textContent = tekst;
    return;
  }

  // Tegn stregen forfra efter `forsinkelse` sek. (= når vendingen er færdig).
  function tegnStreg(forsinkelse){
    streg.classList.remove('tegn');
    void streg.offsetWidth;   // tving reflow så animationen kan genstartes
    streg.style.animationDelay = forsinkelse + 's';
    streg.classList.add('tegn');
  }

  function kommInd(){
    dag.textContent = tekst;
    dag.classList.remove('dagUd');
    dag.classList.remove('dagInd');
    void dag.offsetWidth;
    dag.classList.add('dagInd');
    tegnStreg(0.4);   // starter når indvendingen (0,4 s) er færdig
  }

  if(forste){
    kommInd();
    return;
  }

  // Skift: gammelt dagnavn vipper op (0,3 s), så kommer det nye ind (0,4 s).
  streg.classList.remove('tegn');
  dag.classList.remove('dagInd');
  void dag.offsetWidth;
  dag.classList.add('dagUd');
  setTimeout(function(){
    if(skift !== overskriftSkift) return;   // afbrudt af et nyere skift
    kommInd();
  }, 300);
}

// Midlertidig test: ?testanimation=1 skifter dagnavnet hvert 8. sek.,
// så animationen kan ses uden at vente på dagskiftet. Slået fra som standard.
const TEST_ANIMATION = new URLSearchParams(window.location.search).get('testanimation') === '1';
if(TEST_ANIMATION){
  const testTekster = ['Mandag', 'Tirsdag (i morgen)', 'Tirsdag'];
  let testIndex = 0;
  sætOverskrift(testTekster[0]);
  setInterval(function(){
    testIndex = (testIndex + 1) % testTekster.length;
    sætOverskrift(testTekster[testIndex]);
  }, 8000);
}

function opdaterUr(){
  const nu = new Date();
  document.getElementById('ur').textContent =
    String(nu.getHours()).padStart(2,'0') + ':' +
    String(nu.getMinutes()).padStart(2,'0') + ':' +
    String(nu.getSeconds()).padStart(2,'0');
}

// ==================================================================
// PERSONALE PÅ ARBEJDE
// ==================================================================

async function hentPersonale(){
  if(!sb) return;
  // Niveau 1-3 deler denne ene hentning/rendering-omgang — kan kun
  // springes helt over hvis ALLE tre er slukket.
  if(!beboerskaermAktiv.niveau1 && !beboerskaermAktiv.niveau2 && !beboerskaermAktiv.niveau3) return;

  const visImorgen = skalViseImorgen();
  const dato = måldato();
  const datoStr = datoISO(dato);
  if(!TEST_ANIMATION) sætOverskrift(UGEDAGE[dato.getDay()] + (visImorgen ? ' (i morgen)' : ''));

  // Sektionstitler følger visningen: "i huset nu" / "senere i dag" giver
  // ikke mening i en morgendags-forhåndsvisning.
  document.getElementById('niveau1Titel').textContent = visImorgen ? 'Dagvagt' : 'I huset nu';
  document.getElementById('niveau3Titel').textContent = visImorgen ? 'Nattevagt' : 'Senere i dag';

  const nu = new Date();

  // Workfeed giver en vagt over midnat (døgn-/nattevagt) to rækker, og
  // `dag` er vagtens STARTdag. Når vi viser dagens egen liste, skal vi
  // derfor også hente i går, så en vagt der stadig løber efter midnat ikke
  // mangler. I morgen-visning henter vi kun morgendagen.
  const dage = [datoStr];
  if(!visImorgen){
    const iGår = new Date(nu);
    iGår.setDate(iGår.getDate() - 1);
    dage.unshift(datoISO(iGår));
  }

  const [vagterRes, skjulninger] = await Promise.all([
    sb.from('personaleskaerm_vagter').select('*').in('dag', dage).order('start'),
    hentSkjulninger()
  ]);
  const { data, error } = vagterRes;
  if(error){ console.error('Fejl personale:', error); return; }

  const alle = flettVagter(data || [], visImorgen, nu, datoStr);

  // P-møde-tags skjuler ikke længere nogen: Workfeed giver P-møde-rækkerne
  // hele vagtens tider, så mødets sluttid kan ikke udledes af data, og et
  // gæt skjulte hele dagholdet.

  // Nattevagt der allerede er startet (fx i nat efter midnat) er i huset nu.
  const nattevagtStartet = p => p.rolle === 'Nattevagt' && !visImorgen && new Date(p.start) <= nu;

  const gulv = alle.filter(p => p.rolle === 'Medarbejder' || p.rolle === 'Døgnvagt' || nattevagtStartet(p));
  const nattevagt = alle.filter(p => p.rolle === 'Nattevagt' && !nattevagtStartet(p));
  const funktioner = alle.filter(p => p.rolle !== 'Medarbejder' && p.rolle !== 'Døgnvagt' && p.rolle !== 'Nattevagt');

  // Skjult personale (styres fra appens "Skærm"-fane) filtreres fra HELT
  // til sidst — al beregning ovenfor (fletning, fordeling) kører uændret,
  // så en skjult person aldrig kan påvirke hvem andre der vises.
  const vises = p => !findSkjulning(skjulninger, p.navn, datoStr, nu);

  tegnGulv(gulv.filter(vises), visImorgen);
  tegnFunktioner(funktioner.filter(vises));
  tegnSenere(nattevagt.filter(vises), visImorgen);
}

// Samler rå vagtrækker til ÉN post pr. person og rolle.
//  - Rækker for samme person+rolle der støder op til hinanden (næste starter
//    når forrige slutter, som ved Workfeeds midnatssplit) flettes til én
//    vagt: tidligste start, seneste slut, og første tag der findes.
//    Rækkefølgen i databasen er tilfældig og må aldrig afgøre resultatet.
//  - Dagens egen liste: ikke-døgn/nat-personale skjules før vagten starter
//    og efter den er slut. Vagter fra i går vises kun hvis de stadig løber
//    (døgn-/nattevagt over midnat).
//  - I morgen-visning vises hele morgendagens hold uanset klokkeslæt.
function flettVagter(rækker, visImorgen, nu, datoStr){
  const perNøgle = new Map();
  rækker.forEach(r => {
    const rolle = visningsRolle(r.rolle, r.tag);
    const nøgle = r.navn + '|' + rolle;
    if(!perNøgle.has(nøgle)) perNøgle.set(nøgle, []);
    perNøgle.get(nøgle).push({ ...r, rolle });
  });

  const resultat = [];
  perNøgle.forEach(liste => {
    liste.sort((a, b) => new Date(a.start) - new Date(b.start));
    const flettet = [];
    liste.forEach(r => {
      const sidste = flettet[flettet.length - 1];
      if(sidste && Math.abs(new Date(r.start) - new Date(sidste.slut)) <= 60000){
        if(new Date(r.slut) > new Date(sidste.slut)) sidste.slut = r.slut;
        if(!sidste.tag && r.tag) sidste.tag = r.tag;
      } else {
        flettet.push({ ...r });
      }
    });

    // Samme person to ikke-sammenhængende vagter (fx nattevagt der slutter
    // i morges + ny vagt senere i dag): vis kun den der er i gang, ellers
    // den første.
    const iGang = flettet.find(p => new Date(p.start) <= nu && nu < new Date(p.slut));
    resultat.push(iGang || flettet[0]);
  });

  return resultat.filter(p => {
    const løberOverMidnat = p.rolle === 'Døgnvagt' || p.rolle === 'Nattevagt';
    if(p.dag !== datoStr) return løberOverMidnat && new Date(p.slut) > nu;   // i går
    if(visImorgen || p.rolle === 'Nattevagt') return true;   // nattevagt sorteres senere i gulv/"senere"
    return new Date(p.start) <= nu && nu < new Date(p.slut);
  });
}

// ==================================================================
// SKJULT PERSONALE — rent visningsfilter, se shared/skjult-personale-schema.sql.
// Fail-safe: kan tabellen ikke læses, returneres en tom liste, og ALLE
// vises som hidtil. Skærmen fejler aldrig i retning af at skjule nogen.
// ==================================================================

async function hentSkjulninger(){
  try {
    const { data, error } = await sb.from('skjult_personale')
      .select('navn,dag,udloeber').gt('udloeber', new Date().toISOString());
    if(error){ console.error('Fejl skjult_personale (viser alle):', error); return []; }
    return data || [];
  } catch (e) {
    console.error('Fejl skjult_personale (viser alle):', e);
    return [];
  }
}

// "YYYY-MM-DD" → lokal midnat den dag (browser-lokal tid, ikke UTC).
function skStartAfDag(iso){
  const d = iso.split('-');
  return new Date(Number(d[0]), Number(d[1]) - 1, Number(d[2]));
}

// SAMME regel som findSkjulning() i mollebakken-app-v2 — holdes ens, så
// appen og skærmen altid er enige om hvem der er skjult.
// En skjulning for dag D gælder listen for D. Går personens vagt over
// midnat, gælder den også listen for D+1 — men kun når D+1 faktisk ER
// begyndt (ikke i 19:30-forhåndsvisningen af i morgen), og kun indtil
// udløb (= slutningen af den vagt der går over midnat).
function findSkjulning(skjulninger, navn, visteDagISO, nu){
  const visteStart = skStartAfDag(visteDagISO);
  const dagenFør = new Date(visteStart);
  dagenFør.setDate(dagenFør.getDate() - 1);
  const dagenFørISO = datoISO(dagenFør);
  return skjulninger.find(s => {
    if(s.navn !== navn) return false;
    if(new Date(s.udloeber) <= nu) return false;
    if(s.dag === visteDagISO) return true;
    return s.dag === dagenFørISO && nu >= visteStart;
  }) || null;
}

// Nogle Planday-navne bærer et eller flere rolle-præfikser direkte i
// fornavnet (fx "Vikar: Dalal Abou Chouk", "Pedel: Jens", "Nat Mie
// Kirstine", "Vikar Nat: Ken Søbæk Rasmussen") — med eller uden kolon,
// og nogle gange flere ord i træk. Kræver mindst ét kolon/mellemrum
// efter hvert præfiks-ord, så et rigtigt navn som "Natasha" ikke bliver
// fejlagtigt klippet i "Nat" + "asha".
function renspNavn(navn){
  return (navn || '').replace(/^(?:(?:Pedel|Vikar|Nat)[:\s]+)+/i, '').trim();
}

function fornavn(navn){
  const renset = renspNavn(navn);
  return renset.split(' ')[0] || renset;
}

function initialer(navn){
  const dele = renspNavn(navn).split(/\s+/).filter(Boolean);
  if(dele.length === 0) return '';
  if(dele.length === 1) return dele[0].charAt(0).toUpperCase();
  return (dele[0].charAt(0) + dele[dele.length - 1].charAt(0)).toUpperCase();
}

// Rundt lille portræt (42px/40px) til niveau 2/3 — samme fallback-mønster
// som før (grå cirkel), da spec kun beder om initialer-fallback på niveau 1.
function billedeHtml(url, størrelse){
  if(url) return '<img src="' + escapeHtml(url) + '" style="width:' + størrelse + 'px;height:' + størrelse + 'px" alt="">';
  return '<div class="initialerLille" style="width:' + størrelse + 'px;height:' + størrelse + 'px;border-radius:50%;"></div>';
}

// Stort rektangulært portræt (niveau 1) — hvid initialer på dæmpet
// baggrund når der ikke er noget billede.
function portrætHtmlStor(navn, url, erDøgnvagt){
  const klasse = 'portræt' + (erDøgnvagt ? ' erDøgnvagt' : '');
  if(url) return '<div class="' + klasse + '"><img src="' + escapeHtml(url) + '" alt=""></div>';
  return '<div class="' + klasse + '"><span class="initialer">' + escapeHtml(initialer(navn)) + '</span></div>';
}

function tegnGulv(personer, visImorgen){
  const container = document.getElementById('gulv');
  if(personer.length === 0){
    container.innerHTML = '<div class="tom-tilstand">' + (visImorgen ? 'Ingen dagvagt i morgen' : 'Ingen på arbejde lige nu') + '</div>';
    return;
  }
  container.innerHTML = personer.map(function(p){
    const erDøgnvagt = p.rolle === 'Døgnvagt';
    const tid = erDøgnvagt
      ? '<div class="tid">Døgnvagt</div>'
      : '<div class="tid">' + new Date(p.start).toTimeString().slice(0,5) + '–' + new Date(p.slut).toTimeString().slice(0,5) + '</div>';

    return '<div class="personKort' + (erDøgnvagt ? ' erDøgnvagt' : '') + '">' +
      portrætHtmlStor(p.navn, p.billede, erDøgnvagt) +
      '<div class="navn">' + escapeHtml(fornavn(p.navn)) + '</div>' +
      tid +
      '</div>';
  }).join('');
}

function tegnFunktioner(personer){
  const sektion = document.getElementById('niveau2');
  const container = document.getElementById('funktionerRække');
  if(personer.length === 0){
    sektion.style.display = 'none';
    return;
  }
  sektion.style.display = '';
  container.innerHTML = personer.map(function(p){
    return '<div class="funktionKort">' +
      billedeHtml(p.billede, 42) +
      '<div><div class="navn">' + escapeHtml(fornavn(p.navn)) + '</div>' +
      '<div class="rolle">' + escapeHtml(p.rolle) + '</div></div>' +
      '</div>';
  }).join('');
}

// Niveau 3: nattevagt. Chippen med "Nattevagt" vises kun i dagens visning
// ("Senere i dag"); i morgen-visning hedder sektionen selv "Nattevagt".
function tegnSenere(nattevagt, visImorgen){
  const sektion = document.getElementById('niveau3');
  const container = document.getElementById('senereRække');

  const grupper = [
    { label: visImorgen ? '' : 'Nattevagt', personer: nattevagt }
  ].filter(function(g){ return g.personer.length > 0; });

  if(grupper.length === 0){
    sektion.style.display = 'none';
    return;
  }
  sektion.style.display = '';

  container.innerHTML = grupper.map(function(gruppe){
    return '<div class="senereGruppe">' +
      (gruppe.label ? '<div class="senereGruppeLabel">' + escapeHtml(gruppe.label) + '</div>' : '') +
      '<div class="senereGruppePersoner">' +
      gruppe.personer.map(function(p){
        return '<div class="senereItem">' +
          billedeHtml(p.billede, 40) +
          '<div class="navn">' + escapeHtml(fornavn(p.navn)) + '</div>' +
          '</div>';
      }).join('') +
      '</div></div>';
  }).join('');
}

// ==================================================================
// MADPLAN / AKTIVITET
// ==================================================================

async function hentMadplan(){
  if(!sb) return;
  if(!beboerskaermAktiv.madplan) return;

  const dato = dagensDato();
  const dagensDag = UGEDAGE[dato.getDay()];
  const ugeStart = datoISO(effektivMandag());

  const { data, error } = await sb.from('madplan').select('*').eq('uge_start', ugeStart);
  if(error){ console.error('Fejl madplan:', error); return; }

  const perDag = {};
  (data || []).forEach(r => { perDag[r.dag] = r.ret; });

  document.getElementById('aftensmadRet').textContent = perDag[dagensDag] || 'Ikke angivet';

  const ugedageOrden = ['Mandag','Tirsdag','Onsdag','Torsdag','Fredag','Lørdag','Søndag'];
  document.getElementById('ugensMadGrid').innerHTML = ugedageOrden.map(function(dag){
    return '<div class="ugensMadRække"><span class="dag">' + dag + ':</span> ' + escapeHtml(perDag[dag] || '–') + '</div>';
  }).join('');
}

// Samme Sunday-20:00-effektiv-mandag-regel som Møllebakken-appen bruger
// til Madplan/Aktiviteter — sikrer samme "uge" vises begge steder.
function effektivMandag(){
  const nu = new Date();
  const basis = new Date(nu);
  if(nu.getDay() === 0 && nu.getHours() >= 20){
    basis.setDate(basis.getDate() + 1);
  }
  const dag = basis.getDay();
  const diffTilMandag = dag === 0 ? -6 : 1 - dag;
  const mandag = new Date(basis);
  mandag.setDate(mandag.getDate() + diffTilMandag);
  mandag.setHours(0,0,0,0);
  return mandag;
}

// "Ingen fælles aktivitet" er en sentinel-aktivitet appen bruger til at
// samle "stemningsbilleder" af botilbudet op i, i stedet for at erstatte
// ét fast billede (se AKTIVITET_SENTINEL i mollebakken-app-v2). Når der
// ligger flere billeder til dagens aktivitet, skal de rotere som et
// diasshow her — matcher den gamle Apps Script-udgaves opførsel.
let aktivitetBilledeInterval = null;

async function hentAktivitet(){
  if(!sb) return;
  if(!beboerskaermAktiv.aktivitet) return;

  const dato = dagensDato();
  const dagensDag = UGEDAGE[dato.getDay()];
  const ugeStart = datoISO(effektivMandag());

  const { data, error } = await sb.from('aktiviteter').select('*').eq('uge_start', ugeStart).eq('dag', dagensDag);
  if(error){ console.error('Fejl aktivitet:', error); return; }

  const aktivitet = data && data.length > 0 ? data[0].aktivitet : null;
  document.getElementById('aktivitetNavn').textContent = aktivitet || 'Ingen aktivitet angivet';

  if(aktivitetBilledeInterval){
    clearInterval(aktivitetBilledeInterval);
    aktivitetBilledeInterval = null;
  }

  if(!aktivitet){
    document.getElementById('aktivitetBilledeBoks').innerHTML = '';
    return;
  }

  const { data: billeder } = await sb.from('aktivitet_billeder').select('*').eq('aktivitet_navn', aktivitet);
  if(!billeder || billeder.length === 0){
    document.getElementById('aktivitetBilledeBoks').innerHTML = '';
    return;
  }

  // Billeder ligger i Supabase Storage — storage_path er en offentlig sti.
  const urls = billeder.map(b => sb.storage.from('aktivitet-billeder').getPublicUrl(b.storage_path).data.publicUrl);

  document.getElementById('aktivitetBilledeBoks').innerHTML =
    '<img id="aktivitetBillede" src="' + escapeHtml(urls[0]) + '" alt="">';

  if(urls.length > 1){
    let index = 0;
    aktivitetBilledeInterval = setInterval(function(){
      index = (index + 1) % urls.length;
      const img = document.getElementById('aktivitetBillede');
      if(img) img.src = urls[index];
    }, 10000);
  }
}

// ==================================================================
// VEJR (Open-Meteo, ingen nøgle nødvendig — koordinater for Møllebakkevej 6, Ringe)
// Vejr-emoji er IKKE konverteret til SVG endnu — et fuldt ikonsæt for alle
// vejrkoder er en større opgave end Afkrydsnings tre statusikoner; kan
// tages som en selvstændig opfølgning hvis ønsket.
// ==================================================================

const VEJRKODER = {
  0: ['☀️','Klar himmel'], 1: ['🌤','Mest klart'], 2: ['⛅','Delvist skyet'], 3: ['☁️','Overskyet'],
  45: ['🌫','Tåge'], 48: ['🌫','Rimtåge'],
  51: ['🌦','Let støvregn'], 53: ['🌦','Støvregn'], 55: ['🌧','Tæt støvregn'],
  56: ['🌧','Underkølet støvregn'], 57: ['🌧','Tæt underkølet støvregn'],
  61: ['🌧','Let regn'], 63: ['🌧','Regn'], 65: ['🌧','Kraftig regn'],
  66: ['🌧','Underkølet regn'], 67: ['🌧','Kraftig underkølet regn'],
  71: ['🌨','Let sne'], 73: ['🌨','Sne'], 75: ['❄️','Kraftig sne'], 77: ['❄️','Sne-korn'],
  80: ['🌦','Lette byger'], 81: ['🌧','Byger'], 82: ['⛈','Voldsomme byger'],
  85: ['🌨','Lette snebyger'], 86: ['❄️','Kraftige snebyger'],
  95: ['⛈','Tordenvejr'], 96: ['⛈','Tordenvejr med hagl'], 99: ['⛈','Kraftigt tordenvejr med hagl']
};

async function hentVejr(){
  if(!beboerskaermAktiv.vejr) return;
  try {
    const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=55.28&longitude=10.46&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=Europe/Copenhagen&forecast_days=1');
    const data = await res.json();

    const temp = Math.round(data.current.temperature_2m);
    const kode = data.current.weather_code;
    const [ikon, beskrivelse] = VEJRKODER[kode] || ['🌡','Ukendt'];
    const max = Math.round(data.daily.temperature_2m_max[0]);
    const min = Math.round(data.daily.temperature_2m_min[0]);

    document.getElementById('vejrIkon').textContent = ikon;
    document.getElementById('vejrTemp').textContent = temp + '°';
    document.getElementById('vejrBeskrivelse').textContent = beskrivelse + ' · ' + min + '°/' + max + '°';
  } catch(e){
    console.error('Fejl vejr:', e);
  }
}

// ==================================================================
// SLIDE-ROTATION (Aktivitet ⇄ Ugens madplan, hvert 10. sekund)
// ==================================================================

let slideIndex = 0;
let slides = ['aktivitetSlide', 'madplanSlide'];

function visSlide(){
  // Ryd altid begge slides først — et slukket modul kan være blevet
  // fjernet fra `slides` uden at have mistet sin .vis-klasse fra før.
  document.getElementById('aktivitetSlide').classList.remove('vis');
  document.getElementById('madplanSlide').classList.remove('vis');
  const aktivId = slides[slideIndex];
  if(aktivId) document.getElementById(aktivId).classList.add('vis');
}

// ==================================================================
// INITIALISER
// ==================================================================

function hentAlt(){
  hentPersonale();
  hentMadplan();
  hentAktivitet();
}

hentBeboerskaermIndstillinger();
hentAlt();
hentVejr();
visSlide();
opdaterUr();

setInterval(hentBeboerskaermIndstillinger, 60000);
setInterval(hentAlt, 60000);
setInterval(hentVejr, 1800000);
setInterval(opdaterUr, 1000);
setInterval(() => {
  if(slides.length === 0) return;
  slideIndex = (slideIndex + 1) % slides.length;
  visSlide();
}, 10000);
