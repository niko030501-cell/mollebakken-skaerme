<style>
  *{ box-sizing:border-box; }

  body{
    margin:0;
    font-family:'Archivo', sans-serif;
    background:var(--papir);
    color:var(--blaek);
    height:100vh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  h1,h2,h3{ font-family:'Fraunces', serif; margin:0; }

  /* ---- Topbjælke ---- */

  #topbjælke{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    flex-shrink:0;
    font-size:22px;
    font-weight:700;
    padding:14px 20px;
    border-bottom:2px solid var(--blaek);
  }

  #topHøjreInfo{
    display:flex;
    align-items:baseline;
    gap:20px;
  }

  #vejrMini{
    display:flex;
    align-items:baseline;
    gap:6px;
    font-size:15px;
    font-weight:700;
    color:var(--tekst-2);
  }

  #vejrIkon{ font-size:20px; }
  #vejrBeskrivelse{ font-weight:500; }

  #ur{
    font-size:34px;
    font-weight:800;
    font-variant-numeric:tabular-nums;
    color:var(--blaek);
  }

  /* ---- Layout ---- */

  #layout{
    display:grid;
    grid-template-columns:73% 27%;
    flex:1;
    min-height:0;
    padding:16px 20px;
    gap:20px;
  }

  #venstre{
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    gap:20px;
    min-height:0;
  }

  #højre{
    display:flex;
    flex-direction:column;
    gap:12px;
    min-height:0;
  }

  .niveau .eyebrow{ margin-bottom:10px; }

  /* ---- Niveau 1: I huset nu ---- */

  #gulv{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:18px;
  }

  .personKort .portræt{
    height:130px;
    border-radius:5px;
    overflow:hidden;
    background:var(--tekst-2);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .personKort .portræt img{ width:100%; height:100%; object-fit:cover; }

  .personKort .initialer{
    color:#fff;
    font-size:40px;
    font-weight:700;
  }

  .personKort.erDøgnvagt .portræt{
    outline:4px solid var(--guld);
    outline-offset:-4px;
  }

  .personKort .navn{ font-size:21px; font-weight:800; margin-top:8px; }

  .personKort .tid{ font-size:14px; font-weight:700; color:var(--tekst-2); }

  .personKort.erDøgnvagt .tid{
    color:var(--guld-moerk);
    text-transform:uppercase;
    font-size:12px;
    font-weight:800;
  }

  /* ---- Niveau 2: Andre funktioner ---- */

  #funktionerRække{ display:flex; flex-wrap:wrap; gap:10px; }

  .funktionKort{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--flade);
    border-radius:6px;
    padding:8px 14px;
  }

  .funktionKort img, .funktionKort .initialerLille{
    width:42px; height:42px; border-radius:50%; flex-shrink:0;
  }

  .funktionKort .navn{ font-size:19px; font-weight:800; }

  .funktionKort .rolle{
    font-size:11.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.12em;
    color:var(--tekst-2);
  }

  /* ---- Niveau 3: Senere i dag ---- */

  #senereRække{ display:flex; flex-wrap:wrap; gap:20px; align-items:center; }

  .senereItem{ display:flex; align-items:center; gap:8px; }

  .senereItem img, .senereItem .initialerLille{
    width:40px; height:40px; border-radius:50%; flex-shrink:0;
  }

  .senereItem .navn{ font-size:15px; font-weight:700; }

  .senereItem .kontekst{ font-size:10px; color:var(--tekst-2); }

  /* ---- Fælles: rundt fallback-portræt med initialer (niveau 2/3) ---- */

  .initialerLille{
    background:var(--tekst-2);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    font-weight:700;
  }

  /* ---- Højre kolonne ---- */

  #aftensmad{
    background:var(--brand);
    color:#fff;
    border-radius:6px;
    padding:16px 18px;
    text-align:center;
    flex-shrink:0;
  }

  #aftensmad .eyebrow{ color:var(--guld); }

  #aftensmadRet{ font-size:29px; font-weight:800; color:#fff; margin-top:6px; }

  #aktivitetBoks{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    background:#fff;
    border:1px solid var(--streg);
    border-radius:6px;
    padding:16px 18px;
    overflow:hidden;
  }

  .slide{ display:none; flex-direction:column; height:100%; min-height:0; }
  .slide.vis{ display:flex; }

  .slide .titel{ font-size:25px; font-weight:800; margin-bottom:10px; flex-shrink:0; }

  #aktivitetBilledeBoks{
    flex:1;
    min-height:0;
    border-radius:6px;
    overflow:hidden;
    background:var(--flade);
  }

  #aktivitetBilledeBoks img{ width:100%; height:100%; object-fit:cover; display:block; }

  .ugensMadGrid{ display:grid; grid-template-columns:1fr 1fr; gap:0 20px; overflow-y:auto; }
  .ugensMadRække{ padding:6px 0; border-bottom:1px solid var(--streg-svag); font-size:14px; }
  .ugensMadRække .dag{ font-weight:700; color:var(--blaek); }

  .tom-tilstand{ margin:0; }
</style>

<script>

// ==================================================================
// SUPABASE-KLIENT (defensiv init, samme mønster som de to andre skærme)
// ==================================================================

let sb = null;
try {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
} catch (e) {
  console.error('Kunne ikke oprette Supabase-klient:', e);
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str == null ? '' : str;
  return d.innerHTML;
}

const UGEDAGE = ['Søndag','Mandag','Tirsdag','Onsdag','Torsdag','Fredag','Lørdag'];

// ==================================================================
// Rolle-visningsnavne — rå Workfeed-rolle gemmes i databasen af
// workfeed-sync, men VISES med samme omdøbning som den oprindelige
// hentPersonale() i Kode.js. "Rådighedsvagt" (rå) → "Døgnvagt" (vist) —
// filtrering nedenfor sker altid på det VISTE navn, matcher gammel logik.
// ==================================================================

function visningsRolle(raaRolle, tag){
  if(tag === 'P-møde' || tag === 'P-møde m. vagt') return raaRolle === 'Rådighedsvagt' ? 'Døgnvagt' : (rolleTabel[raaRolle] || raaRolle);
  const tabel = {
    'Daglig leder': 'Leder',
    'Køkkenpersonale': 'Køkken',
    'Pedel': 'Pedel',
    'Vågen nattevagt': 'Nattevagt',
    'Socialfaglig medarbejder': 'Medarbejder',
    'SSA': 'Medicinvagt',
    'Rådighedsvagt': 'Døgnvagt'
  };
  return tabel[raaRolle] || raaRolle;
}
const rolleTabel = {
  'Daglig leder': 'Leder', 'Køkkenpersonale': 'Køkken', 'Pedel': 'Pedel',
  'Vågen nattevagt': 'Nattevagt', 'Socialfaglig medarbejder': 'Medarbejder',
  'SSA': 'Medicinvagt', 'Rådighedsvagt': 'Døgnvagt'
};

// ==================================================================
// Dag-omslag kl. 19:30 — client-side klok-check, IKKE en Apps
// Script-trigger (som var upræcis nok til at være en dokumenteret
// læring på tværs af alle tre Møllebakken-projekter). Genberegnes ved
// hvert poll, så der ikke er nogen "trigger" der kan ramme forkert.
// Gælder KUN personale-listen — madplan og aktivitet skifter først
// ved midnat, se dagensDato().
// ==================================================================

function skalViseImorgen(){
  const nu = new Date();
  return nu.getHours() > 19 || (nu.getHours() === 19 && nu.getMinutes() >= 30);
}

function måldato(){
  const nu = new Date();
  if(skalViseImorgen()) nu.setDate(nu.getDate() + 1);
  return nu;
}

function dagensDato(){
  return new Date();
}

function datoISO(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function opdaterUr(){
  const nu = new Date();
  document.getElementById('ur').textContent =
    String(nu.getHours()).padStart(2,'0') + ':' +
    String(nu.getMinutes()).padStart(2,'0') + ':' +
    String(nu.getSeconds()).padStart(2,'0');
}

// ==================================================================
// PERSONALE PÅ ARBEJDE
// ==================================================================

async function hentPersonale(){
  if(!sb) return;

  const visImorgen = skalViseImorgen();
  const dato = måldato();
  const datoStr = datoISO(dato);
  document.getElementById('overskriftDag').textContent = UGEDAGE[dato.getDay()] + (visImorgen ? ' (i morgen)' : '');

  const { data, error } = await sb.from('personaleskaerm_vagter').select('*').eq('dag', datoStr);
  if(error){ console.error('Fejl personale:', error); return; }

  const nu = new Date();
  const nuMinutter = nu.getHours() * 60 + nu.getMinutes();

  // Dedup på navn+rolle (midnatssplit kan give to rækker for samme
  // døgnvagt/nattevagt-person samme dag).
  const set = new Map();

  (data || []).forEach(r => {
    const rolle = visningsRolle(r.rolle, r.tag);
    const nøgle = r.navn + '|' + rolle;
    if(set.has(nøgle)) return;

    const slut = new Date(r.slut);
    const slutMinutter = slut.getHours() * 60 + slut.getMinutes();

    // Ikke-Døgnvagt/Nattevagt personale forsvinder når vagten er slut —
    // men kun når vi viser DAGENS egen liste, ikke en morgendags-forhåndsvisning.
    if(!visImorgen && rolle !== 'Døgnvagt' && rolle !== 'Nattevagt'){
      if(nuMinutter > slutMinutter) return;
    }

    set.set(nøgle, { ...r, rolle });
  });

  const alle = [...set.values()];

  const gulv = alle.filter(p => p.rolle === 'Medarbejder' || p.rolle === 'Døgnvagt');
  const nattevagt = alle.filter(p => p.rolle === 'Nattevagt');
  const funktioner = alle.filter(p => p.rolle !== 'Medarbejder' && p.rolle !== 'Døgnvagt' && p.rolle !== 'Nattevagt');

  tegnGulv(gulv);
  tegnFunktioner(funktioner);
  tegnSenere(nattevagt, beregnPmødePersoner(alle, nu));
}

// Nogle Planday-navne bærer et rolle-præfiks direkte i fornavnet (fx
// "Vikar: Dalal Abou Chouk", "Pedel: Jens", "Nat: ..."). Fjernes her, samme
// oprensning som den oprindelige renspNavn() i Visning.js.
function renspNavn(navn){
  return (navn || '').replace(/^(Pedel|Vikar|Nat):\s*/i, '').trim();
}

function fornavn(navn){
  const renset = renspNavn(navn);
  return renset.split(' ')[0] || renset;
}

function initialer(navn){
  const dele = renspNavn(navn).split(/\s+/).filter(Boolean);
  if(dele.length === 0) return '';
  if(dele.length === 1) return dele[0].charAt(0).toUpperCase();
  return (dele[0].charAt(0) + dele[dele.length - 1].charAt(0)).toUpperCase();
}

// Rundt lille portræt (42px/40px) til niveau 2/3 — samme fallback-mønster
// som før (grå cirkel), da spec kun beder om initialer-fallback på niveau 1.
function billedeHtml(url, størrelse){
  if(url) return '<img src="' + escapeHtml(url) + '" style="width:' + størrelse + 'px;height:' + størrelse + 'px" alt="">';
  return '<div class="initialerLille" style="width:' + størrelse + 'px;height:' + størrelse + 'px;border-radius:50%;"></div>';
}

// Stort rektangulært portræt (niveau 1) — hvid initialer på dæmpet
// baggrund når der ikke er noget billede.
function portrætHtmlStor(navn, url, erDøgnvagt){
  const klasse = 'portræt' + (erDøgnvagt ? ' erDøgnvagt' : '');
  if(url) return '<div class="' + klasse + '"><img src="' + escapeHtml(url) + '" alt=""></div>';
  return '<div class="' + klasse + '"><span class="initialer">' + escapeHtml(initialer(navn)) + '</span></div>';
}

function tegnGulv(personer){
  const container = document.getElementById('gulv');
  if(personer.length === 0){
    container.innerHTML = '<div class="tom-tilstand">Ingen på arbejde lige nu</div>';
    return;
  }
  container.innerHTML = personer.map(function(p){
    const erDøgnvagt = p.rolle === 'Døgnvagt';
    const tid = erDøgnvagt
      ? '<div class="tid">Døgnvagt</div>'
      : '<div class="tid">' + new Date(p.start).toTimeString().slice(0,5) + '–' + new Date(p.slut).toTimeString().slice(0,5) + '</div>';

    return '<div class="personKort' + (erDøgnvagt ? ' erDøgnvagt' : '') + '">' +
      portrætHtmlStor(p.navn, p.billede, erDøgnvagt) +
      '<div class="navn">' + escapeHtml(fornavn(p.navn)) + '</div>' +
      tid +
      '</div>';
  }).join('');
}

function tegnFunktioner(personer){
  const sektion = document.getElementById('niveau2');
  const container = document.getElementById('funktionerRække');
  if(personer.length === 0){
    sektion.style.display = 'none';
    return;
  }
  sektion.style.display = '';
  container.innerHTML = personer.map(function(p){
    return '<div class="funktionKort">' +
      billedeHtml(p.billede, 42) +
      '<div><div class="navn">' + escapeHtml(fornavn(p.navn)) + '</div>' +
      '<div class="rolle">' + escapeHtml(p.rolle) + '</div></div>' +
      '</div>';
  }).join('');
}

// Personale tagget "P-møde m. vagt" regnes med indtil mødet er slut
// (seneste sluttidspunkt for et P-møde den dag), IKKE med det samme.
// Ren beregning — ingen DOM-skrivning — så den kan genbruges af tegnSenere().
function beregnPmødePersoner(alle, nu){
  const pMødePersoner = alle.filter(p => p.tag === 'P-møde m. vagt');
  const pMødeSlutTider = alle.filter(p => p.tag === 'P-møde').map(p => new Date(p.slut));

  const senesteSlut = pMødeSlutTider.length > 0 ? new Date(Math.max(...pMødeSlutTider)) : null;
  const mødeErSlut = !senesteSlut || nu >= senesteSlut;

  return mødeErSlut ? [] : pMødePersoner;
}

// Niveau 3: nattevagt + folk der kommer efter p-møde, slået sammen til
// én liste (jf. designbrief) — kontekst-teksten holder dem adskilte visuelt.
function tegnSenere(nattevagt, pmødePersoner){
  const sektion = document.getElementById('niveau3');
  const container = document.getElementById('senereRække');

  const alle = nattevagt.map(function(p){ return { p: p, kontekst: 'Nattevagt' }; })
    .concat(pmødePersoner.map(function(p){ return { p: p, kontekst: 'Efter P-møde' }; }));

  if(alle.length === 0){
    sektion.style.display = 'none';
    return;
  }
  sektion.style.display = '';

  container.innerHTML = alle.map(function(item){
    return '<div class="senereItem">' +
      billedeHtml(item.p.billede, 40) +
      '<div><div class="navn">' + escapeHtml(fornavn(item.p.navn)) + '</div>' +
      '<div class="kontekst">' + escapeHtml(item.kontekst) + '</div></div>' +
      '</div>';
  }).join('');
}

// ==================================================================
// MADPLAN / AKTIVITET
// ==================================================================

async function hentMadplan(){
  if(!sb) return;

  const dato = dagensDato();
  const dagensDag = UGEDAGE[dato.getDay()];
  const ugeStart = datoISO(effektivMandag());

  const { data, error } = await sb.from('madplan').select('*').eq('uge_start', ugeStart);
  if(error){ console.error('Fejl madplan:', error); return; }

  const perDag = {};
  (data || []).forEach(r => { perDag[r.dag] = r.ret; });

  document.getElementById('aftensmadRet').textContent = perDag[dagensDag] || 'Ikke angivet';

  const ugedageOrden = ['Mandag','Tirsdag','Onsdag','Torsdag','Fredag','Lørdag','Søndag'];
  document.getElementById('ugensMadGrid').innerHTML = ugedageOrden.map(function(dag){
    return '<div class="ugensMadRække"><span class="dag">' + dag + ':</span> ' + escapeHtml(perDag[dag] || '–') + '</div>';
  }).join('');
}

// Samme Sunday-20:00-effektiv-mandag-regel som Møllebakken-appen bruger
// til Madplan/Aktiviteter — sikrer samme "uge" vises begge steder.
function effektivMandag(){
  const nu = new Date();
  const basis = new Date(nu);
  if(nu.getDay() === 0 && nu.getHours() >= 20){
    basis.setDate(basis.getDate() + 1);
  }
  const dag = basis.getDay();
  const diffTilMandag = dag === 0 ? -6 : 1 - dag;
  const mandag = new Date(basis);
  mandag.setDate(mandag.getDate() + diffTilMandag);
  mandag.setHours(0,0,0,0);
  return mandag;
}

async function hentAktivitet(){
  if(!sb) return;

  const dato = dagensDato();
  const dagensDag = UGEDAGE[dato.getDay()];
  const ugeStart = datoISO(effektivMandag());

  const { data, error } = await sb.from('aktiviteter').select('*').eq('uge_start', ugeStart).eq('dag', dagensDag);
  if(error){ console.error('Fejl aktivitet:', error); return; }

  const aktivitet = data && data.length > 0 ? data[0].aktivitet : null;
  document.getElementById('aktivitetNavn').textContent = aktivitet || 'Ingen aktivitet angivet';

  if(!aktivitet){
    document.getElementById('aktivitetBilledeBoks').innerHTML = '';
    return;
  }

  const { data: billeder } = await sb.from('aktivitet_billeder').select('*').eq('aktivitet_navn', aktivitet);
  if(billeder && billeder.length > 0){
    // Billeder ligger i Supabase Storage — storage_path er en offentlig sti.
    const { data: pub } = sb.storage.from('aktivitet-billeder').getPublicUrl(billeder[0].storage_path);
    document.getElementById('aktivitetBilledeBoks').innerHTML = '<img src="' + escapeHtml(pub.publicUrl) + '" alt="">';
  } else {
    document.getElementById('aktivitetBilledeBoks').innerHTML = '';
  }
}

// ==================================================================
// VEJR (Open-Meteo, ingen nøgle nødvendig — koordinater for Møllebakkevej 6, Ringe)
// Vejr-emoji er IKKE konverteret til SVG endnu — et fuldt ikonsæt for alle
// vejrkoder er en større opgave end Afkrydsnings tre statusikoner; kan
// tages som en selvstændig opfølgning hvis ønsket.
// ==================================================================

const VEJRKODER = {
  0: ['☀️','Klar himmel'], 1: ['🌤','Mest klart'], 2: ['⛅','Delvist skyet'], 3: ['☁️','Overskyet'],
  45: ['🌫','Tåge'], 48: ['🌫','Rimtåge'],
  51: ['🌦','Let støvregn'], 53: ['🌦','Støvregn'], 55: ['🌧','Tæt støvregn'],
  56: ['🌧','Underkølet støvregn'], 57: ['🌧','Tæt underkølet støvregn'],
  61: ['🌧','Let regn'], 63: ['🌧','Regn'], 65: ['🌧','Kraftig regn'],
  66: ['🌧','Underkølet regn'], 67: ['🌧','Kraftig underkølet regn'],
  71: ['🌨','Let sne'], 73: ['🌨','Sne'], 75: ['❄️','Kraftig sne'], 77: ['❄️','Sne-korn'],
  80: ['🌦','Lette byger'], 81: ['🌧','Byger'], 82: ['⛈','Voldsomme byger'],
  85: ['🌨','Lette snebyger'], 86: ['❄️','Kraftige snebyger'],
  95: ['⛈','Tordenvejr'], 96: ['⛈','Tordenvejr med hagl'], 99: ['⛈','Kraftigt tordenvejr med hagl']
};

async function hentVejr(){
  try {
    const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=55.28&longitude=10.46&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=Europe/Copenhagen&forecast_days=1');
    const data = await res.json();

    const temp = Math.round(data.current.temperature_2m);
    const kode = data.current.weather_code;
    const [ikon, beskrivelse] = VEJRKODER[kode] || ['🌡','Ukendt'];
    const max = Math.round(data.daily.temperature_2m_max[0]);
    const min = Math.round(data.daily.temperature_2m_min[0]);

    document.getElementById('vejrIkon').textContent = ikon;
    document.getElementById('vejrTemp').textContent = temp + '°';
    document.getElementById('vejrBeskrivelse').textContent = beskrivelse + ' · ' + min + '°/' + max + '°';
  } catch(e){
    console.error('Fejl vejr:', e);
  }
}

// ==================================================================
// SLIDE-ROTATION (Aktivitet ⇄ Ugens madplan, hvert 10. sekund)
// ==================================================================

let slideIndex = 0;
const slides = ['aktivitetSlide', 'madplanSlide'];

function visSlide(){
  slides.forEach((id, i) => {
    document.getElementById(id).classList.toggle('vis', i === slideIndex);
  });
}

// ==================================================================
// INITIALISER
// ==================================================================

function hentAlt(){
  hentPersonale();
  hentMadplan();
  hentAktivitet();
}

hentAlt();
hentVejr();
visSlide();
opdaterUr();

setInterval(hentAlt, 60000);
setInterval(hentVejr, 1800000);
setInterval(opdaterUr, 1000);
setInterval(() => {
  slideIndex = (slideIndex + 1) % slides.length;
  visSlide();
}, 10000);

</script>
