<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    *{ margin:0; padding:0; box-sizing:border-box; }

    body{
      font-family:'Archivo', sans-serif;
      background:var(--papir);
      color:var(--blaek);
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ---- Topbjælke ---- */

    #topbjælke{
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      padding: 14px 20px;
      border-bottom: 2px solid var(--blaek);
    }

    #topHøjreInfo{
      display: flex;
      align-items: center;
      gap: 16px;
    }

    #datoUr{
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }

    #dato{
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--tekst-2);
    }

    #ur{
      font-size: 34px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--blaek);
    }

    /* ---- Sider ---- */

    #sideWrapper{
      flex: 1;
      min-height: 0;
      position: relative;
    }

    .side{
      display: none;
      flex-direction: column;
      height: 100%;
      overflow-y: auto;
      padding: 20px;
    }

    .active{ display: flex; }

    /* ---- QR ---- */

    #qrBoks{
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--flade);
      border-radius: 6px;
      padding: 4px 8px;
    }

    #qrBoks img{
      width: 26px;
      height: 26px;
      border-radius: 3px;
    }

    #qrBoks .qrTekst{
      font-size: 8px;
      font-weight: 700;
      color: var(--tekst-2);
      line-height: 1.25;
      max-width: 80px;
    }

    /* ---- Beboerkolonner (alle fire faner — ingen kort, ingen skygger) ---- */

    .beboerKolonner{
      display: grid;
      flex: 1;
      min-height: 0;
    }

    #ugeplanerContainer{ grid-template-columns: repeat(6, 1fr); }
    #afkrydsningContainer{ grid-template-columns: repeat(6, 1fr); }
    #overlapFarveContainer{ grid-template-columns: repeat(6, 1fr); }

    .beboerKolonne{
      padding: 0 16px;
      border-left: 1px solid var(--streg);
      overflow-y: auto;
    }

    .beboerKolonne:first-child{ border-left: none; }

    .beboerKolonne ul{ list-style: none; margin-top: 12px; }

    .beboerKolonne .afsender{
      color: var(--tekst-2);
      font-weight: 400;
    }

    /* ---- Fra sidste p-møde ---- */

    .pmoedeIndhold{ font-size: 22px; }

    .pmoedeTypeOverskrift{
      font-family: 'Archivo', sans-serif;
      font-size: 17px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--tekst-2);
      margin: 22px 0 8px 0;
    }
    .pmoedeTypeOverskrift:first-child{ margin-top: 0; }

    .pmoedePunkt{
      padding: 10px 0;
      border-bottom: 1px solid var(--streg-svag);
    }
    .pmoedeTekst{ font-size: 24px; font-weight: 600; color: var(--blaek); }
    .pmoedeMeta{ font-size: 16px; color: var(--tekst-2); margin-top: 4px; }

    .pmoedeSideIndikator{
      position: absolute;
      bottom: 20px;
      right: 24px;
      font-size: 14px;
      font-weight: 700;
      color: var(--tom);
    }

    .pmoedeTom{
      font-size: 18px;
      color: var(--tom);
    }

    /* Note-tegn til højre på et dagsplan-punkt der har en instruktion i appen */
    .listepunkt .instruktionMaerke{
      width: calc(16px * var(--tekst-skala, 1));
      height: calc(16px * var(--tekst-skala, 1));
      color: var(--guld-moerk);
      align-self: center;
    }

    .listepunkt.nu .afsender,
    .listepunkt.akut .afsender{ color: rgba(255,255,255,.65); }

    /* ---- Lister ---- */

    ul{
      list-style: none;
      margin: 0;
      padding: 0;
    }

    /* ---- Prioritet (Beskeder) ----
       Akut deler visuel behandling med .listepunkt.nu (tokens.css).
       Vær opmærksom = guld venstrekant. Information = ingen markering. */

    .listepunkt.opmærksom{
      border-left: 5px solid var(--guld);
      padding-left: 8px;
      background: rgba(216, 155, 43, .12);
      margin-right: -8px;
      padding-top: calc(4px * var(--tekst-skala, 1));
      padding-bottom: calc(4px * var(--tekst-skala, 1));
      border-radius: 0 3px 3px 0;
    }

    /* ---- Vedhæftet fil (knap under en besked) ----
       Til fjernbetjening (ikke touch): et rigtigt <button>, som kan få fokus
       med piletaster og åbnes med OK/Enter. Hvilende = rolig lys knap med
       ramme, så den ikke forstyrrer normal visning. Fokus = "nu-block"
       (kontrasten vendt om, som .listepunkt.nu i tokens.css) plus en
       tyk guld-kant, så man kan se hvor man er på afstand. */

    .filRække{
      flex: 0 0 100%;
      min-width: 0;
      display: flex;
      justify-content: flex-start;
      margin-top: calc(4px * var(--tekst-skala, 1));
    }

    .listepunkt.harFil{ flex-wrap: wrap; }

    .filKnap{
      display: inline-flex;
      align-items: center;
      gap: .45em;
      min-width: 0;
      max-width: 100%;
      font-family: 'Archivo', sans-serif;
      font-size: calc(12.5px * var(--tekst-skala, 1));
      font-weight: 700;
      line-height: 1.2;
      color: var(--blaek);
      background: #fff;
      border: 2px solid var(--blaek);
      border-radius: 4px;
      padding: calc(4px * var(--tekst-skala, 1)) calc(9px * var(--tekst-skala, 1));
      cursor: pointer;
      text-align: left;
    }
    .filKnap[hidden]{ display: none; }

    .filKnap .filNavn{
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .filKnap svg{
      width: 1.15em;
      height: 1.15em;
      flex-shrink: 0;
    }

    .filKnap:focus{
      background: var(--blaek);
      color: #fff;
      border-color: var(--guld);
      outline: 4px solid var(--guld);
      outline-offset: 2px;
    }

    #filFejlBoks{
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 50;
      max-width: 80%;
      background: var(--blaek);
      color: #fff;
      border: 3px solid var(--guld);
      border-radius: 6px;
      padding: 12px 22px;
      font-size: 18px;
      font-weight: 700;
      text-align: center;
    }
    #filFejlBoks[hidden]{ display: none; }

    /* ---- Overskrifter ---- */

    /* ---- Overlap: toprække med døgnvagt ---- */

    .topRække{
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 4px;
    }

    .topRække .stor-overskrift{ margin-bottom: 0; }

    .dognvagtBoks{ text-align: right; }

    .dognvagtNavn{ font-size: 15px; font-weight: 800; }

    /* ---- Overlap: dagens vurdering (prikker) ---- */

    .sektionLabel{ margin-top: 18px; margin-bottom: 2px; }

    .vurderingRække{
      display: flex;
      justify-content: center;
      gap: 6px;
      margin: 14px 0 16px 0;
    }

    .vurderingPrik{ width: 24px; height: 24px; border-radius: 50%; }
    .vurderingPrik.tom{ background: #d1d5db; }
    .vurderingPrik.rød{ background: #ef4444; }
    .vurderingPrik.gul{ background: #f59e0b; }
    .vurderingPrik.grøn{ background: #22c55e; }

    /* ---- Overlap: fælles vagt-tjekliste ---- */

    .tjeklisteBoks{ max-width: 900px; margin: 24px auto 0 auto; }
    .tjeklisteBoks .eyebrow{ text-align: center; display: block; margin-bottom: 6px; }
    .tjeklisteGrid{ columns: 2; column-gap: 40px; }
    .tjeklisteGrid .listepunkt{ break-inside: avoid; }

    /* ---- Beskeder: én række pr. beboer + HUSET-bjælke ----
       Layoutet er tegnet til 1280×720 og skaleres til skærmen med --s (1 "designpixel").
       Browsere uden min() beholder 1px (ingen skalering, men stadig brugbart). */

    #beskeder{ --s: 1px; }
    @supports (width: min(1px, 2px)){
      #beskeder{ --s: min(calc(100vw / 1280), calc(100vh / 720)); }
    }

    #beskeder.side{
      padding: calc(var(--s) * 12) calc(var(--s) * 20) calc(var(--s) * 14);
      gap: calc(var(--s) * 10);
    }

    .bRækker{
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: calc(var(--s) * 8);
    }

    .bRække{
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      align-items: center;
      gap: calc(var(--s) * 18);
      background: #fff;
      border-radius: calc(var(--s) * 12);
      padding: calc(var(--s) * 6) calc(var(--s) * 16);
    }

    .bNavn{
      flex: 0 0 calc(var(--s) * 200);
      display: flex;
      align-items: center;
      gap: calc(var(--s) * 12);
      font-size: calc(var(--s) * 24);
      font-weight: 800;
      color: #1A1A1A;
    }

    .bCirkel{
      flex: 0 0 auto;
      width: calc(var(--s) * 46);
      height: calc(var(--s) * 46);
      border-radius: 50%;
      background: var(--tom);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: calc(var(--s) * 24);
      font-weight: 800;
    }

    .bChips{
      flex: 1;
      min-width: 0;
      align-self: stretch;
      display: flex;
      flex-wrap: wrap;
      align-content: center;
      gap: calc(var(--s) * 8);
      overflow: hidden;
    }

    .bChip{
      display: inline-flex;
      align-items: center;
      gap: calc(var(--s) * 8);
      max-width: 100%;
      padding: calc(var(--s) * 6) calc(var(--s) * 12);
      border-radius: calc(var(--s) * 10);
      background: var(--papir);
      color: #1A1A1A;
      font-size: calc(var(--s) * 20);
      font-weight: 700;
      line-height: 1.15;
    }
    .bChip.vigtig{ background: #C2410C; color: #fff; }
    .bChip.mere{ background: #1A1A1A; color: #fff; }

    .bIkon{ display: inline-flex; flex: 0 0 auto; }
    .bIkon svg{ width: calc(var(--s) * 22); height: calc(var(--s) * 22); }
    .bTekst{ min-width: 0; overflow-wrap: anywhere; }

    .bTid, .bNy{
      flex: 0 0 auto;
      font-size: calc(var(--s) * 13);
      font-weight: 800;
      letter-spacing: .04em;
      padding: calc(var(--s) * 3) calc(var(--s) * 7);
      border-radius: calc(var(--s) * 6);
      white-space: nowrap;
    }
    .bTid{ background: #1A1A1A; color: #fff; }
    .bNy{ background: #FACC15; color: #1A1A1A; }

    .bChip .filKnap, .bHusetPunkt .filKnap{
      flex: 0 0 auto;
      font-size: calc(var(--s) * 16);
      padding: calc(var(--s) * 3) calc(var(--s) * 7);
    }
    .filKnap.kompakt .filNavn{ display: none; }

    .bHuset{
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: calc(var(--s) * 18);
      background: #1A1A1A;
      color: #fff;
      border-radius: calc(var(--s) * 12);
      padding: calc(var(--s) * 10) calc(var(--s) * 16);
    }
    .bHusetMaerke{
      flex: 0 0 calc(var(--s) * 200);
      font-size: calc(var(--s) * 24);
      font-weight: 800;
      letter-spacing: .2em;
    }
    .bHusetListe{
      flex: 1;
      min-width: 0;
      display: flex;
      flex-wrap: wrap;
      align-content: center;
      gap: calc(var(--s) * 6) calc(var(--s) * 24);
      max-height: calc(var(--s) * 84);
      overflow: hidden;
    }
    .bHusetPunkt{
      display: inline-flex;
      align-items: center;
      gap: calc(var(--s) * 8);
      font-size: calc(var(--s) * 20);
      font-weight: 700;
      line-height: 1.15;
      max-width: 100%;
    }
    .bHusetPunkt.mere{ color: #FACC15; }
    .bVigtigt{ color: #FB923C; font-weight: 800; }
    .bHuset .bTid{ background: #fff; color: #1A1A1A; }
    .bHusetTom{ color: #A3A3A3; font-size: calc(var(--s) * 20); font-weight: 500; }

    #beskederContainer{ flex: 1; min-height: 0; display: flex; flex-direction: column; gap: calc(var(--s) * 10); }

    /* ---- Loading ---- */

    .loading{
      text-align: center;
      color: #9ca3af;
      padding: 40px;
      font-size: 14px;
    }
  </style>
</head>

<script>

// ---- Supabase-klient ----
// Klientoprettelse kastes synkront hvis URL/nøgle er ugyldig (fx uudfyldte
// placeholders). Uret og fane-rotationen skal virke uanset — dette er en
// uovervåget skærm — så en fejl her må ALDRIG stoppe resten af scriptet.

let sb = null;

try {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
} catch (e) {
  console.error('Kunne ikke oprette Supabase-klient:', e);
}

function visSupabaseFejl(){
  document.querySelectorAll('.loading').forEach(el => {
    el.textContent = 'Kan ikke forbinde til Supabase — tjek SUPABASE_URL/SUPABASE_KEY i index.html.';
  });
}

if(!sb) visSupabaseFejl();

// ---- Tilstand ----

let aktuelSide = 'beskeder';
let sidsteUgeplanData = null;

const knapIdPerSide = {
  beskeder:     'btnBeskeder',
  ugeplaner:    'btnUgeplaner',
  afkrydsning:  'btnAfkrydsning',
  overlap:      'btnOverlap',
  pmoede:       'btnPmoede',
  la2:          'btnLa2'
};

const UGEDAGE = ['Søndag','Mandag','Tirsdag','Onsdag','Torsdag','Fredag','Lørdag'];
const OVERLAP_TIDSPUNKTER = ['Kl. 08','Kl. 13','Kl. 18','Kl. 22','Kl. 03 (nattevagt)'];

// ---- Fanevisning ----

function visSide(side){
  document.querySelectorAll('.side').forEach(d => d.classList.remove('active'));
  document.getElementById(side).classList.add('active');

  document.querySelectorAll('.fane-nav button').forEach(b => b.classList.remove('aktiv'));
  // Ikke alle faner har en synlig knap i nav'en (fx pmoede, og
  // afkrydsning/overlap er bevidst skjult) — spring roligt over.
  const knap = document.getElementById(knapIdPerSide[side]);
  if(knap) knap.classList.add('aktiv');

  aktuelSide = side;

  // Beskeder/Dagsplan har typisk allerede data fra det periodiske hent-kald —
  // de skal bare måles igen nu de reelt er synlige (display:none giver 0 i
  // højde, så målingen dur ikke før nu). Afkrydsning/Overlap måler sig selv
  // i bunden af deres respektive vis-funktion, kaldt herunder.
  if(side === 'beskeder') tilpasBeskedRækker();
  if(side === 'ugeplaner') tilpasAlleKolonner('ugeplanerContainer');
  if(side === 'pmoede'){
    pmoedeSideIndex = 0;
    pmoedeSideStart = Date.now();
    visPmoedeSide();
  }
  if(side === 'la2' && window.LA2Fane) window.LA2Fane.vis();
  if(side === 'afkrydsning') hentAfkrydsningsskema();
  if(side === 'overlap') hentOverlap();
}

// ---- Hjælpefunktioner ----

function datoISO(d){
  const år = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const dag = String(d.getDate()).padStart(2,'0');
  return år + '-' + m + '-' + dag;
}

function datoLabel(datoStr){
  if(!datoStr) return '';
  const d = new Date(datoStr + 'T00:00:00');
  if(isNaN(d.getTime())) return '';

  const nu = new Date();
  const dD = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const nD = new Date(nu.getFullYear(), nu.getMonth(), nu.getDate());
  const forskel = Math.round((nD - dD) / 86400000);

  if(forskel === 0) return 'i dag';
  if(forskel === 1) return 'i går';
  if(forskel > 1 && forskel < 7) return forskel + ' dage siden';
  return String(d.getDate()).padStart(2,'0') + '-' + String(d.getMonth()+1).padStart(2,'0');
}

function prioritetRang(p){
  if(p === 'Rød') return 0;
  if(p === 'Gul') return 1;
  if(p === 'Grøn') return 2;
  return 3;
}

function tidTilMinutter(tid){
  if(!tid) return null;
  const m = tid.toString().trim().match(/^(\d{1,2})[:.](\d{2})/);
  if(!m) return null;
  const t = parseInt(m[1],10);
  const min = parseInt(m[2],10);
  if(isNaN(t) || isNaN(min)) return null;
  return t * 60 + min;
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// Vi kender ikke tavlens faktiske skærmopløsning/zoom-niveau, så i stedet
// for at gætte på faste pixel-størrelser måler vi om en kolonnes indhold
// rent faktisk passer i den plads den har, og skrumper tekst+afstand
// trinvist (via --tekst-skala, se tokens.css) indtil den gør.
function tilpasTekstTilHøjde(kolonne){
  // Siden er ikke synlig lige nu (display:none giver 0 i højde) — visSide()
  // måler igen næste gang denne fane rent faktisk vises.
  if(kolonne.clientHeight === 0) return;

  kolonne.style.removeProperty('--tekst-skala');
  if(kolonne.scrollHeight <= kolonne.clientHeight + 1) return;

  const GULV = 0.35;

  // Start fra et beregnet skøn i stedet for at trimme ned fra 1.0 i faste
  // trin — hurtigere frem til målet, og tillader en lavere bund (0.35) for
  // dage med usædvanligt mange punkter.
  let skala = Math.max(GULV, (kolonne.clientHeight / kolonne.scrollHeight) * 0.94);
  kolonne.style.setProperty('--tekst-skala', skala.toFixed(2));

  let forsøg = 0;
  while(kolonne.scrollHeight > kolonne.clientHeight + 1 && skala > GULV && forsøg < 12){
    skala = Math.max(GULV, skala - 0.03);
    kolonne.style.setProperty('--tekst-skala', skala.toFixed(2));
    forsøg++;
  }
}

function tilpasAlleKolonner(containerId){
  document.querySelectorAll('#' + containerId + ' .beboerKolonne').forEach(tilpasTekstTilHøjde);
}

// ---- BESKEDER ----
// Én række pr. beboer med beskederne som chips (ikon efter kategori + titel + tid-mærke),
// og en mørk HUSET-bjælke nederst. Udløbne beskeder (fjernes_efter passeret, lokal tid) vises ikke.
// Opdateres hvert 60. sekund (se setInterval nederst) — ingen realtime-abonnement.

const BESKED_DAGE_KORT = ['SØN', 'MAN', 'TIR', 'ONS', 'TOR', 'FRE', 'LØR'];
const BESKED_FALLBACK_BEBOERE = ['Louie', 'Kenneth', 'Lars', 'Niels', 'Leyla'];
let beboereTavle = [];   // [{ navn, farve }]

// Kategori-ikoner: tre genbruges fra shared/ikoner.js, resten (Tabler, outline) ligger her
const BESKED_IKONER_FÆLLES = { mad: 'mad', aktivitet: 'aktivitet', rutine: 'ur' };
const BESKED_IKONER_LOKALE = {
  sundhed: [["path",{"d":"M19.5 12.572l-7.5 7.428l-7.5 -7.428a5 5 0 1 1 7.5 -6.566a5 5 0 1 1 7.5 6.572"}]],
  besoeg:  [["path",{"d":"M14 12v.01"}],["path",{"d":"M3 21h18"}],["path",{"d":"M6 21v-16a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v16"}]],
  fest:    [["path",{"d":"M3 8m0 1a1 1 0 0 1 1 -1h16a1 1 0 0 1 1 1v2a1 1 0 0 1 -1 1h-16a1 1 0 0 1 -1 -1z"}],["path",{"d":"M12 8l0 13"}],["path",{"d":"M19 12v7a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-7"}],["path",{"d":"M7.5 8a2.5 2.5 0 0 1 0 -5a4.8 8 0 0 1 4.5 5a4.8 8 0 0 1 4.5 -5a2.5 2.5 0 0 1 0 5"}]],
  koersel: [["path",{"d":"M5 17m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"}],["path",{"d":"M17 17m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"}],["path",{"d":"M5 17h-2v-6l2 -5h9l4 5h1a2 2 0 0 1 2 2v4h-2m-4 0h-6m-6 -6h15m-6 0v-5"}]],
  info:    [["path",{"d":"M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0"}],["path",{"d":"M12 9h.01"}],["path",{"d":"M11 12h1v4h1"}]]
};

function beskedKategoriIkon(kategori){
  if(BESKED_IKONER_FÆLLES[kategori]) return moelleIkon(BESKED_IKONER_FÆLLES[kategori], { stoerrelse: 22 });
  const dele = BESKED_IKONER_LOKALE[kategori] || BESKED_IKONER_LOKALE.info;
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', 'currentColor');
  svg.setAttribute('stroke-width', '1.9');
  svg.setAttribute('stroke-linecap', 'round');
  svg.setAttribute('stroke-linejoin', 'round');
  svg.setAttribute('aria-hidden', 'true');
  dele.forEach(function(del){
    const el = document.createElementNS(NS, del[0]);
    Object.keys(del[1]).forEach(function(a){ el.setAttribute(a, del[1][a]); });
    svg.appendChild(el);
  });
  return svg;
}

async function hentBeskeder(){
  if(!sb) return;
  const [svar, beboerSvar] = await Promise.all([
    sb.from('beskeder').select('*').eq('aktiv', true).order('created_at', { ascending: false }),
    sb.from('beboere').select('navn,farve,sortering').order('sortering')
  ]);

  if(svar.error){ console.error('Fejl beskeder:', svar.error); return; }
  if(!beboerSvar.error && beboerSvar.data && beboerSvar.data.length > 0){
    beboereTavle = beboerSvar.data;
  } else if(beboereTavle.length === 0){
    beboereTavle = BESKED_FALLBACK_BEBOERE.map(function(n){ return { navn: n, farve: null }; });
  }
  visBeskeder(svar.data || []);
}

// ---- Vedhæftede filer (knap under en besked) ----
// Knapperne bygges med DOM-metoder (aldrig HTML-strenge), og filnavnet
// sættes med textContent. Stien/linket findes IKKE i siden: linket hentes
// først når nogen åbner filen (det udløber efter 60 sek.).

const FIL_PAUSE_MS = 60000;   // rotationen står stille så længe nogen navigerer, +60 sek. efter sidste tryk
let filPauseIndtil = 0;
let filÅbner = false;
let filFejlTimer = null;
let sidsteBeskedSignatur = null;

function lavBinderIkon(){
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', 'currentColor');
  svg.setAttribute('stroke-width', '2.4');
  svg.setAttribute('stroke-linecap', 'round');
  svg.setAttribute('stroke-linejoin', 'round');
  svg.setAttribute('aria-hidden', 'true');
  const sti = document.createElementNS(NS, 'path');
  sti.setAttribute('d', 'M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48');
  svg.appendChild(sti);
  return svg;
}

// Fylder en .filKnap med ikon + filnavn og gør den klar til at åbne beskeden.
function udfyldFilKnap(knap, beskedId, filNavn){
  knap.textContent = '';
  knap.dataset.beskedId = beskedId;
  knap.setAttribute('aria-label', 'Åbn vedhæftning: ' + filNavn);
  knap.appendChild(lavBinderIkon());
  const navn = document.createElement('span');
  navn.className = 'filNavn';
  navn.textContent = filNavn;
  knap.appendChild(navn);
}

function lavFilKnap(beskedId, filNavn){
  const knap = document.createElement('button');
  knap.type = 'button';
  knap.className = 'filKnap';
  udfyldFilKnap(knap, beskedId, filNavn);
  return knap;
}

function synligeFilKnapper(){
  return Array.prototype.filter.call(document.querySelectorAll('#beskeder .filKnap'), function(k){ return !k.hidden; });
}

function forlængFilPause(){
  filPauseIndtil = Date.now() + FIL_PAUSE_MS;
}

function visFilFejl(tekst){
  const boks = document.getElementById('filFejlBoks');
  boks.textContent = tekst;
  boks.hidden = false;
  clearTimeout(filFejlTimer);
  filFejlTimer = setTimeout(function(){ boks.hidden = true; }, 8000);
}

// Henter et friskt 60-sekunders link når der trykkes, og åbner filen i SAMME
// vindue — så fjernbetjeningens tilbage-knap fører tilbage til tavlen.
async function åbnBeskedFil(knap){
  if(filÅbner || !sb) return;
  filÅbner = true;
  forlængFilPause();
  const navnEl = knap.querySelector('.filNavn');
  const oprindeligt = navnEl ? navnEl.textContent : '';
  if(navnEl) navnEl.textContent = 'Åbner…';
  try{
    const { data, error } = await sb.functions.invoke('besked-fil', {
      body: { action: 'hent', besked_id: knap.dataset.beskedId }
    });
    if(error || !data || !data.url) throw (error || new Error('Intet link'));
    window.location.assign(data.url);
  } catch(e){
    console.error('Kunne ikke åbne fil:', e);
    visFilFejl('Filen kunne ikke åbnes. Prøv igen om lidt.');
  } finally {
    if(navnEl) navnEl.textContent = oprindeligt;
    filÅbner = false;
  }
}

// Klik/OK på en filknap (delegeret, så knapperne kan bygges om uden nye lyttere)
document.addEventListener('click', function(e){
  const knap = e.target.closest ? e.target.closest('.filKnap') : null;
  if(knap) åbnBeskedFil(knap);
});

// Piletaster flytter fokus mellem filknapperne (lineært); OK/Enter åbner via den
// almindelige button-aktivering. Springes over mens morgen-overlayet vises.
document.addEventListener('keydown', function(e){
  if(aktuelSide !== 'beskeder') return;
  if(document.querySelector('.dbOverlay')) return;
  const knapper = synligeFilKnapper();
  if(knapper.length === 0) return;

  const frem = e.key === 'ArrowDown' || e.key === 'ArrowRight';
  const tilbage = e.key === 'ArrowUp' || e.key === 'ArrowLeft';
  if(!frem && !tilbage){
    if(e.key === 'Enter' && knapper.indexOf(document.activeElement) !== -1) forlængFilPause();
    return;
  }

  e.preventDefault();
  const nu = knapper.indexOf(document.activeElement);
  let næste;
  if(nu === -1) næste = frem ? 0 : knapper.length - 1;
  else næste = (nu + (frem ? 1 : -1) + knapper.length) % knapper.length;
  knapper[næste].focus();
  if(knapper[næste].scrollIntoView) knapper[næste].scrollIntoView({ block: 'nearest' });
  forlængFilPause();
});

document.addEventListener('focusin', function(e){
  if(e.target.classList && e.target.classList.contains('filKnap')) forlængFilPause();
});

// Tid-mærke: "TIR 13:00", "ONS", "I DAG 09:30". Tomt for fast info (ingen dato).
function beskedTidMaerke(r){
  if(!r.hvornaar_dato) return '';
  const d = r.hvornaar_dato.split('-').map(Number);
  const dato = new Date(d[0], d[1] - 1, d[2]);
  const dagTekst = r.hvornaar_dato === datoISO(new Date()) ? 'I DAG' : BESKED_DAGE_KORT[dato.getDay()];
  return dagTekst + (r.hvornaar_tid ? ' ' + r.hvornaar_tid.slice(0, 5) : '');
}

// En række fra databasen -> det der skal vises (eller null hvis den er udløbet). Browserens lokale tid.
function beskedTilVisning(r, nu){
  if(r.fjernes_efter && new Date(r.fjernes_efter) <= nu) return null;
  const beboere = (r.beboere && r.beboere.length > 0) ? r.beboere : [r.beboer === 'Personale' ? 'Huset' : r.beboer];
  return {
    id: r.id,
    beboere: beboere,
    titel: r.titel || r.besked,
    kategori: r.kategori || 'info',
    vigtig: !!r.vigtig || r.prioritet === 'Rød',
    tid: beskedTidMaerke(r),
    ny: (nu.getTime() - new Date(r.created_at).getTime()) < 48 * 3600 * 1000,
    oprettet: new Date(r.created_at).getTime(),
    fil: r.fil_sti ? (r.fil_navn || 'Vedhæftet fil') : null
  };
}

function sorterBeskeder(liste){
  return liste.slice().sort(function(a, b){ return ((b.vigtig ? 1 : 0) - (a.vigtig ? 1 : 0)) || (b.oprettet - a.oprettet); });
}

function lavEl(tag, klasse, tekst){
  const e = document.createElement(tag);
  if(klasse) e.className = klasse;
  if(tekst != null) e.textContent = tekst;
  return e;
}

function lavBeskedFilKnap(v){
  const knap = lavFilKnap(v.id, v.fil);
  knap.classList.add('kompakt');
  return knap;
}

function lavBeskedChip(v){
  const chip = lavEl('span', 'bChip' + (v.vigtig ? ' vigtig' : ''));
  const ikon = lavEl('span', 'bIkon');
  ikon.appendChild(beskedKategoriIkon(v.kategori));
  chip.appendChild(ikon);
  chip.appendChild(lavEl('span', 'bTekst', v.titel));
  if(v.tid) chip.appendChild(lavEl('span', 'bTid', v.tid));
  if(v.ny) chip.appendChild(lavEl('span', 'bNy', 'NY'));
  if(v.fil) chip.appendChild(lavBeskedFilKnap(v));
  return chip;
}

function lavHusetPunkt(v){
  const punkt = lavEl('span', 'bHusetPunkt');
  if(v.vigtig) punkt.appendChild(lavEl('span', 'bVigtigt', 'Vigtigt:'));
  punkt.appendChild(lavEl('span', 'bTekst', v.titel));
  if(v.tid) punkt.appendChild(lavEl('span', 'bTid', v.tid));
  if(v.ny) punkt.appendChild(lavEl('span', 'bNy', 'NY'));
  if(v.fil) punkt.appendChild(lavBeskedFilKnap(v));
  return punkt;
}

// Passer chipsene ikke i rækken, skjules de sidste og "+ X mere" vises i stedet for at teksten bliver lille.
function tilpasChips(rod, elementKlasse, mereKlasse){
  Array.prototype.forEach.call(rod.querySelectorAll('.mere'), function(e){ e.remove(); });
  const alle = Array.prototype.slice.call(rod.querySelectorAll(elementKlasse));
  alle.forEach(function(e){ e.style.display = ''; });
  if(rod.clientHeight === 0) return;   // siden er ikke synlig — måles igen når den vises
  function passer(){ return rod.scrollHeight <= rod.clientHeight + 1; }
  if(passer()) return;

  const mere = lavEl('span', mereKlasse + ' mere');
  rod.appendChild(mere);
  let skjult = 0;
  for(let i = alle.length - 1; i >= 0; i--){
    alle[i].style.display = 'none';
    skjult++;
    mere.textContent = '+ ' + skjult + ' mere';
    if(passer()) break;
  }
}

function tilpasBeskedRækker(){
  Array.prototype.forEach.call(document.querySelectorAll('#beskederContainer .bChips'), function(rod){
    tilpasChips(rod, '.bChip', 'bChip');
  });
  const huset = document.querySelector('#beskederContainer .bHusetListe');
  if(huset) tilpasChips(huset, '.bHusetPunkt', 'bHusetPunkt');
}

function visBeskeder(data){
  const nu = new Date();
  const alle = data.map(function(r){ return beskedTilVisning(r, nu); }).filter(function(v){ return v; });
  const huset = sorterBeskeder(alle.filter(function(v){ return v.beboere.indexOf('Huset') !== -1; }));
  const rækker = beboereTavle.map(function(b){
    return {
      navn: b.navn,
      farve: b.farve,
      beskeder: sorterBeskeder(alle.filter(function(v){ return v.beboere.indexOf(b.navn) !== -1; }))
    };
  });

  // Er intet ændret (typisk hvert 60. sek.), rører vi slet ikke ved siden —
  // så fokus på en filknap nulstilles aldrig af den almindelige opdatering.
  const signatur = JSON.stringify([rækker, huset]);
  if(signatur === sidsteBeskedSignatur) return;
  sidsteBeskedSignatur = signatur;

  // Er noget ændret, gendannes fokus på samme besked's knap bagefter.
  const fokuseret = document.activeElement;
  const fokusId = (fokuseret && fokuseret.classList && fokuseret.classList.contains('filKnap'))
    ? fokuseret.dataset.beskedId : null;

  const container = document.getElementById('beskederContainer');
  container.textContent = '';

  const rækkerEl = lavEl('div', 'bRækker');
  rækker.forEach(function(r){
    const række = lavEl('div', 'bRække');
    const navn = lavEl('div', 'bNavn');
    const cirkel = lavEl('span', 'bCirkel', r.navn.charAt(0).toUpperCase());
    if(r.farve) cirkel.style.background = r.farve;
    navn.appendChild(cirkel);
    navn.appendChild(lavEl('span', null, r.navn));
    række.appendChild(navn);
    const chips = lavEl('div', 'bChips');
    r.beskeder.forEach(function(v){ chips.appendChild(lavBeskedChip(v)); });
    række.appendChild(chips);
    rækkerEl.appendChild(række);
  });
  container.appendChild(rækkerEl);

  const bjælke = lavEl('div', 'bHuset');
  bjælke.appendChild(lavEl('div', 'bHusetMaerke', 'HUSET'));
  const liste = lavEl('div', 'bHusetListe');
  if(huset.length === 0) liste.appendChild(lavEl('span', 'bHusetTom', 'Ingen beskeder til huset'));
  huset.forEach(function(v){ liste.appendChild(lavHusetPunkt(v)); });
  bjælke.appendChild(liste);
  container.appendChild(bjælke);

  tilpasBeskedRækker();

  if(fokusId){
    const gen = synligeFilKnapper().find(function(k){ return k.dataset.beskedId === fokusId; });
    if(gen) gen.focus({ preventScroll: true });
  }
}

// ---- UGEPLANER / DAGSPLAN ----

async function hentUgeplaner(){
  if(!sb) return;
  const { data, error } = await sb
    .from('ugeplaner')
    .select('*');

  if(error){ console.error('Fejl ugeplaner:', error); return; }
  sidsteUgeplanData = data || [];
  tegnUgeplaner();
}

// Lille note-tegn: punktet har en instruktion i appen (selve teksten vises ikke på tavlen)
const INSTRUKTION_MAERKE = '<svg class="moelle-ikon instruktionMaerke" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-label="Se instruktion i appen">' +
  '<path d="M6 4h11a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-11a1 1 0 0 1 -1 -1v-14a1 1 0 0 1 1 -1m3 0v18"></path>' +
  '<path d="M13 8l2 0"></path><path d="M13 12l2 0"></path></svg>';

function tegnUgeplaner(){
  if(!sidsteUgeplanData) return;

  const container = document.getElementById('ugeplanerContainer');
  container.innerHTML = '';

  let nu = new Date();
  let visesForMorgendagen = false;

  if(nu.getHours() >= 20){
    nu.setDate(nu.getDate() + 1);
    visesForMorgendagen = true;
  }

  const dagensDag = UGEDAGE[nu.getDay()];
  const nuMinutter = nu.getHours() * 60 + nu.getMinutes();

  document.getElementById('dagOverskrift').innerHTML = visesForMorgendagen
    ? 'Dagsplan &bull; ' + dagensDag + ' <span style="color:var(--tom);font-weight:400;text-transform:none">(i morgen)</span>'
    : 'Dagsplan &bull; ' + dagensDag;

  const grupper = {};
  sidsteUgeplanData.forEach(r => {
    if(r.ugedag !== dagensDag) return;
    const nøgle = r.beboer;
    if(!grupper[nøgle]) grupper[nøgle] = { beboer: r.beboer, aktiviteter: [] };
    grupper[nøgle].aktiviteter.push({ tid: r.tid, aktivitet: r.aktivitet, harInstruktion: !!r.instruktion });
  });

  for(const nøgle in grupper){
    const gruppe = grupper[nøgle];

    const aMedMin = gruppe.aktiviteter.map(item => ({
      ...item,
      minutter: tidTilMinutter(item.tid)
    }));

    aMedMin.sort((a,b) => {
      if(a.minutter === null) return 1;
      if(b.minutter === null) return -1;
      return a.minutter - b.minutter;
    });

    let nuIndeks = -1;
    if(!visesForMorgendagen){
      aMedMin.forEach((item, i) => {
        if(item.minutter !== null && item.minutter <= nuMinutter) nuIndeks = i;
      });
    }

    const kolonne = document.createElement('div');
    kolonne.className = 'beboerKolonne';

    let liHtml = aMedMin.map((item, i) => {
      let klasse = 'listepunkt';
      let flag = '';

      if(i === nuIndeks){
        klasse += ' nu';
        flag = '<span class="punkt-flag">Nu</span>';
      } else if(i < nuIndeks){
        klasse += ' overstået';
      }

      return '<li class="' + klasse + '">' +
        '<span class="klokkeslæt">' + escapeHtml(item.tid) + '</span>' +
        '<span class="tekst">' + escapeHtml(item.aktivitet) + '</span>' +
        flag +
        (item.harInstruktion ? INSTRUKTION_MAERKE : '') +
        '</li>';
    }).join('');

    kolonne.innerHTML =
      '<span class="beboer-tag ' + gruppe.beboer.toLowerCase() + '">' + gruppe.beboer.toUpperCase() + '</span>' +
      '<ul>' + liHtml + '</ul>';

    container.appendChild(kolonne);
  }

  tilpasAlleKolonner('ugeplanerContainer');
}

// ---- AFKRYDSNINGSSKEMA ----

function afkrydsningVisningsdato(){
  const nu = new Date();
  const minutter = nu.getHours() * 60 + nu.getMinutes();

  if(minutter < 555){
    const igår = new Date(nu);
    igår.setDate(igår.getDate() - 1);
    return { dato: igår, visesSomIgår: true };
  }
  return { dato: nu, visesSomIgår: false };
}

function opdaterAfkrydsningOverskrift(){
  const el = document.getElementById('afkrydsningOverskrift');
  if(!el) return;
  const { dato, visesSomIgår } = afkrydsningVisningsdato();
  const ugedag = UGEDAGE[dato.getDay()];
  el.innerHTML = visesSomIgår
    ? 'Afkrydsningsskema &bull; ' + ugedag + ' <span style="color:var(--tom);font-weight:400;text-transform:none">(fra i går)</span>'
    : 'Afkrydsningsskema &bull; ' + ugedag;
}

function afkrydsningStatusFraCelle(val){
  const t = (val || '').toString().trim().toLowerCase();
  if(t === 'ja' || t === 'udført') return 'udført';
  if(t === 'ikkerelevant' || t === 'ikkeRelevant') return 'ikkeRelevant';
  return 'ikkeGjort';
}

// Status-farvesprog genbruger nu/overstået fra tokens.css, men med en
// anden betydning end på Dagsplan: her er "nu" IKKE et tidspunkt, men
// "det der mangler handling" — dvs. ikke gjort endnu. Udført falmer til
// opacity .4 (samme som overståede aktiviteter), ikke relevant er neutral.
function afkrydsningStatusKlasse(status){
  if(status === 'udført') return 'overstået';
  if(status === 'ikkeRelevant') return 'ikkeRelevant';
  return 'nu';
}

function afkrydsningStatusIkon(status){
  if(status === 'udført') return moelleIkonTjek();
  if(status === 'ikkeRelevant') return moelleIkonStreg();
  return moelleIkonKryds();
}

async function hentAfkrydsningsskema(){
  opdaterAfkrydsningOverskrift();
  if(!sb) return;

  const { dato } = afkrydsningVisningsdato();
  const datoStr = datoISO(dato);

  const [opgaverRes, afkrydsRes] = await Promise.all([
    sb.from('opgavelister').select('*').order('sortering'),
    sb.from('afkrydsninger').select('*').eq('dato', datoStr)
  ]);

  if(opgaverRes.error){ console.error('Fejl opgavelister:', opgaverRes.error); return; }
  if(afkrydsRes.error){ console.error('Fejl afkrydsninger:', afkrydsRes.error); return; }

  const statusSæt = {};
  (afkrydsRes.data || []).forEach(r => {
    statusSæt[r.beboer + '|' + r.opgave] = r.status;
  });

  const beboerOrden = [];
  const opgaverPerBeboer = {};

  (opgaverRes.data || []).forEach(r => {
    if(!opgaverPerBeboer[r.beboer]){
      opgaverPerBeboer[r.beboer] = [];
      beboerOrden.push(r.beboer);
    }
    opgaverPerBeboer[r.beboer].push({
      opgave: r.opgave,
      status: statusSæt[r.beboer + '|' + r.opgave] || 'ikkeGjort'
    });
  });

  visAfkrydsningsskema(beboerOrden.map(b => ({
    beboer: b,
    opgaver: opgaverPerBeboer[b]
  })));
}

function visAfkrydsningsskema(beboere){
  const container = document.getElementById('afkrydsningContainer');
  container.innerHTML = '';

  beboere.forEach(beboerData => {
    const kolonne = document.createElement('div');
    kolonne.className = 'beboerKolonne';

    let liHtml = beboerData.opgaver.map(o => {
      return '<li class="listepunkt ' + afkrydsningStatusKlasse(o.status) + '">' +
        '<span class="tekst">' + escapeHtml(o.opgave) + '</span>' +
        afkrydsningStatusIkon(o.status) +
        '</li>';
    }).join('');

    kolonne.innerHTML =
      '<span class="beboer-tag ' + beboerData.beboer.toLowerCase() + '">' +
        beboerData.beboer.toUpperCase() +
      '</span><ul>' + liHtml + '</ul>';

    container.appendChild(kolonne);
  });

  tilpasAlleKolonner('afkrydsningContainer');
}

// ---- OVERLAP ----

async function hentOverlap(){
  if(!sb) return;
  const { dato } = afkrydsningVisningsdato();
  const datoStr = datoISO(new Date());

  const [farveRes, journalRes, punktRes, tjekRes, dvRes] = await Promise.all([
    sb.from('overlap_farver').select('*').eq('dato', datoStr),
    sb.from('overlap_journal').select('*').eq('dato', datoStr),
    sb.from('overlap_tjekliste_opgaver').select('*').order('sortering'),
    sb.from('overlap_tjekliste').select('*').eq('dato', datoStr),
    sb.from('overlap_dognvagt').select('*').eq('dato', datoStr).limit(1)
  ]);

  const farverPerBeboer = {};
  (farveRes.data || []).forEach(r => {
    if(!farverPerBeboer[r.beboer]) farverPerBeboer[r.beboer] = {};
    farverPerBeboer[r.beboer][r.farve] = true;
  });

  const journalPerNøgle = {};
  (journalRes.data || []).forEach(r => {
    journalPerNøgle[r.beboer + '|' + r.tidspunkt] = r.skrevet;
  });

  const BEBOERE = ['Louie','Kenneth','Lars','Niels','Leyla'];
  const beboere = BEBOERE.map(beboer => ({
    beboer,
    farver: ['rød','gul','grøn'].filter(f => farverPerBeboer[beboer] && farverPerBeboer[beboer][f]),
    journal: OVERLAP_TIDSPUNKTER.map(t => ({
      tidspunkt: t,
      skrevet: !!journalPerNøgle[beboer + '|' + t]
    }))
  }));

  const punkter = (punktRes.data || []).map(r => r.opgave);

  const udførtSæt = {};
  (tjekRes.data || []).forEach(r => {
    if(r.udfoert) udførtSæt[r.opgave] = true;
  });

  const tjekliste = punkter.map(p => ({ opgave: p, udført: !!udførtSæt[p] }));

  const døgnvagt = dvRes.data && dvRes.data.length > 0 ? dvRes.data[0].navn : null;

  visOverlap({
    dato: datoStr,
    beboere,
    tjekliste,
    døgnvagt
  });
}

function overlapVurderingHtml(farver){
  if(!farver || farver.length === 0){
    return '<span class="vurderingPrik tom"></span>';
  }
  return farver.map(f => '<span class="vurderingPrik ' + f + '"></span>').join('');
}

// Journal-tidspunkter får bevidst IKKE nu/overstået-farvning — at afgøre
// om et tidspunkt reelt er overskredet ville kræve ny forretningslogik.
// Kun et diskret guld-ikon markerer "ikke skrevet endnu".
function overlapJournalIkon(skrevet){
  return skrevet
    ? moelleIkonTjek()
    : '<svg class="moelle-ikon" style="color:var(--guld-moerk)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6L18 18M18 6L6 18"></path></svg>';
}

function visOverlap(data){
  const ugedag = UGEDAGE[new Date(data.dato + 'T00:00:00').getDay()];

  document.getElementById('overlapOverskrift').innerHTML = 'Overlap-skema &bull; ' + ugedag;
  document.getElementById('dognvagtNavn').textContent = data.døgnvagt || 'Ikke fundet';

  const farveContainer = document.getElementById('overlapFarveContainer');
  farveContainer.innerHTML = '';

  data.beboere.forEach(b => {
    const kolonne = document.createElement('div');
    kolonne.className = 'beboerKolonne';

    let journalHtml = b.journal.map(j =>
      '<li class="listepunkt"><span class="klokkeslæt">' + escapeHtml(j.tidspunkt) +
      '</span><span class="tekst"></span>' + overlapJournalIkon(j.skrevet) + '</li>'
    ).join('');

    kolonne.innerHTML =
      '<span class="beboer-tag ' + b.beboer.toLowerCase() + '">' + b.beboer.toUpperCase() + '</span>' +
      '<div class="eyebrow sektionLabel" style="text-align:center">Dagens vurdering</div>' +
      '<div class="vurderingRække">' + overlapVurderingHtml(b.farver) + '</div>' +
      '<div class="eyebrow sektionLabel">Journal</div>' +
      '<ul>' + journalHtml + '</ul>';

    farveContainer.appendChild(kolonne);
  });

  tilpasAlleKolonner('overlapFarveContainer');

  const tjekContainer = document.getElementById('overlapTjeklisteContainer');
  if(data.tjekliste.length === 0){
    tjekContainer.innerHTML = '';
    return;
  }

  let tjekHtml = '<div class="tjeklisteBoks"><span class="eyebrow">Fælles vagt-tjekliste</span><div class="tjeklisteGrid">';
  data.tjekliste.forEach(p => {
    const klasse = p.udført ? 'overstået' : 'nu';
    const ikon = p.udført ? moelleIkonTjek() : moelleIkonKryds();
    tjekHtml += '<div class="listepunkt ' + klasse + '"><span class="tekst">' + escapeHtml(p.opgave) +
      '</span>' + ikon + '</div>';
  });
  tjekHtml += '</div></div>';
  tjekContainer.innerHTML = tjekHtml;
}

// ---- FRA SIDSTE P-MØDE ----
// Henter de vigtige punkter (highlights) fra referatsystemets seneste
// afsluttede møde (personalemoede-v2, samme Supabase-projekt). Ingen nye
// tabeller — genbruger moeder/highlights. Hvis der er flere punkter end
// der er plads til på én skærm, deles de op i flere "sider" der skifter
// automatisk mens p-møde-fanen er aktiv, inden for fanens visningstid.

const PMOEDE_TYPE_LABELS = { beslutning: 'Beslutning', opgave: 'Opgave', info: 'Info', til_naeste: 'Til næste møde' };
const PMOEDE_TYPE_RAEKKEFOELGE = ['beslutning', 'opgave', 'info', 'til_naeste'];
const PMOEDE_MAKS_PR_SIDE = 6;

let pmoedeData = null;      // { moede, highlights } eller null hvis intet møde/ingen highlights
let pmoedeSider = [];
let pmoedeSideIndex = 0;
let pmoedeSideStart = 0;

function pmoedeDatoLabel(datoStr){
  const d = new Date(datoStr + 'T00:00:00');
  if(isNaN(d.getTime())) return '';
  return UGEDAGE[d.getDay()] + ' ' + String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0');
}

async function hentPmoede(){
  if(!sb) return;

  const { data: moeder, error } = await sb
    .from('moeder')
    .select('*')
    .eq('status', 'afsluttet')
    .order('dato', { ascending: false })
    .order('starttid', { ascending: false })
    .limit(1);

  if(error){ console.error('Fejl pmoede (moeder):', error); return; }
  const moede = (moeder && moeder.length > 0) ? moeder[0] : null;

  if(!moede){ pmoedeData = null; pmoedeSider = []; return; }

  const { data: highlights, error: hlFejl } = await sb
    .from('highlights')
    .select('*')
    .eq('moede_id', moede.id)
    .eq('vist_paa_skaerm', true)
    .order('oprettet_at', { ascending: true });

  if(hlFejl){ console.error('Fejl pmoede (highlights):', hlFejl); return; }

  pmoedeData = { moede, highlights: highlights || [] };
  byggPmoedeSider();

  if(aktuelSide === 'pmoede') visPmoedeSide();
}

function byggPmoedeSider(){
  pmoedeSider = [];
  if(!pmoedeData || pmoedeData.highlights.length === 0) return;

  const sorteret = pmoedeData.highlights.slice().sort((a, b) =>
    PMOEDE_TYPE_RAEKKEFOELGE.indexOf(a.type) - PMOEDE_TYPE_RAEKKEFOELGE.indexOf(b.type)
  );

  for(let i = 0; i < sorteret.length; i += PMOEDE_MAKS_PR_SIDE){
    pmoedeSider.push(sorteret.slice(i, i + PMOEDE_MAKS_PR_SIDE));
  }
}

function visPmoedeSide(){
  const overskrift = document.getElementById('pmoedeOverskrift');
  const indhold = document.getElementById('pmoedeIndhold');
  const indikator = document.getElementById('pmoedeSideIndikator');

  if(!pmoedeData || pmoedeSider.length === 0){
    overskrift.textContent = 'Fra sidste p-møde';
    indhold.innerHTML = '<div class="pmoedeTom">Ingen vigtige punkter fra sidste møde.</div>';
    indikator.textContent = '';
    return;
  }

  overskrift.textContent = 'Fra sidste p-møde — ' + pmoedeDatoLabel(pmoedeData.moede.dato);

  const side = pmoedeSider[pmoedeSideIndex] || [];
  let html = '';
  let sidsteType = null;

  side.forEach(h => {
    if(h.type !== sidsteType){
      html += '<div class="pmoedeTypeOverskrift">' + escapeHtml(PMOEDE_TYPE_LABELS[h.type] || h.type) + '</div>';
      sidsteType = h.type;
    }
    let meta = '';
    if(h.type === 'opgave'){
      const dele = [];
      if(h.ansvarlig) dele.push('Ansvarlig: ' + escapeHtml(h.ansvarlig));
      if(h.deadline) dele.push('Frist: ' + pmoedeDatoLabel(h.deadline));
      meta = dele.join(' · ');
    }
    html += '<div class="pmoedePunkt"><div class="pmoedeTekst">' + escapeHtml(h.tekst) + '</div>' +
      (meta ? '<div class="pmoedeMeta">' + meta + '</div>' : '') + '</div>';
  });

  indhold.innerHTML = html;
  indikator.textContent = pmoedeSider.length > 1 ? (pmoedeSideIndex + 1) + ' / ' + pmoedeSider.length : '';
}

function tjekPmoedeSideSkift(){
  if(aktuelSide !== 'pmoede' || pmoedeSider.length <= 1) return;
  const totalVisningstid = normaleVisningstider.pmoede || 30000;
  const varighedPrSide = totalVisningstid / pmoedeSider.length;
  if(Date.now() - pmoedeSideStart >= varighedPrSide){
    pmoedeSideIndex = (pmoedeSideIndex + 1) % pmoedeSider.length;
    pmoedeSideStart = Date.now();
    visPmoedeSide();
  }
}

// ---- TIDSSTYRET ROTATION ----

let normalIndex = 0;
// Fallback indtil skaerm_indstillinger er hentet — fail-safe hvis
// tabellen ikke kan læses (se hentSkaermIndstillinger()).
let normaleSider = ['beskeder', 'ugeplaner'];
let normaleVisningstider = { beskeder: 30000, ugeplaner: 30000 };

// Admin-styret (skaerm_indstillinger, skaerm='infoskaerm') — rækkefølge
// og visningstid for NORMAL-rotationen. Morgen/aften nedenfor er bevidst
// IKKE admin-styret, de forbliver hardkodede (aftalt med bruger).
async function hentSkaermIndstillinger(){
  if(!sb) return;

  const { data, error } = await sb
    .from('skaerm_indstillinger')
    .select('*')
    .eq('skaerm', 'infoskaerm')
    .eq('aktiv', true)
    .order('raekkefoelge');

  // Fail-safe: kan indstillingerne ikke hentes, beholdes den nuværende
  // (evt. hardkodede fallback-) liste uændret i stedet for at fejle.
  if(error){ console.error('Fejl skaerm_indstillinger:', error); return; }
  if(!data || data.length === 0) return;

  // P-møde-knappen i nav'en følger kun admin-tændt/slukket — vises altid
  // når den er tændt, uanset om der lige nu er highlights at vise (klikker
  // man ind manuelt uden indhold, vises den almindelige tom-tilstand).
  // Den AUTOMATISKE rotation nedenfor er strengere og springer den over
  // når der intet er at vise, så den uovervågede skærm ikke "farer forbi"
  // en tom side.
  document.getElementById('btnPmoede').style.display = data.some(r => r.noegle === 'pmoede') ? '' : 'none';
  document.getElementById('btnLa2').style.display = data.some(r => r.noegle === 'la2') ? '' : 'none';

  let sider = data
    .map(r => r.noegle)
    .filter(noegle => noegle !== 'pmoede' || (pmoedeData && pmoedeData.highlights.length > 0));

  if(sider.length === 0) sider = ['beskeder'];   // aldrig en tom rotation

  normaleSider = sider;

  const nyeVisningstider = {};
  data.forEach(r => { nyeVisningstider[r.noegle] = (r.visningstid_sek || 30) * 1000; });
  normaleVisningstider = nyeVisningstider;

  if(normalIndex >= normaleSider.length) normalIndex = 0;
}

let rotationTilstand = 'NORMAL';
let sidsteNormaltSkift = Date.now();

let faseIndex = 0;
let faseStart = 0;

// Afkrydsning/Overlap fjernet fra rotationen (fanerne er skjult, se
// nav'en ovenfor) — læg dem tilbage her hvis funktionen slås til igen.
const morgenFaser = [
  { side: 'beskeder',    varighed: 30000 },
  { side: 'ugeplaner',   varighed: 30000 }
];

const aftenFaser = [
  { side: 'beskeder',    varighed: 15000 },
  { side: 'ugeplaner',   varighed: 15000 }
];

function minutterNu(){
  const nu = new Date();
  return nu.getHours() * 60 + nu.getMinutes();
}

// Står rotationen stille fordi nogen navigerer til en filknap? Når der har været
// ro i FIL_PAUSE_MS, slippes fokus, og fanen får en frisk visningstid i stedet
// for at skifte med det samme.
function filPauseAktiv(){
  if(filPauseIndtil === 0) return false;
  if(Date.now() < filPauseIndtil) return true;
  filPauseIndtil = 0;
  const fokuseret = document.activeElement;
  if(fokuseret && fokuseret.classList && fokuseret.classList.contains('filKnap')) fokuseret.blur();
  sidsteNormaltSkift = Date.now();
  faseStart = Date.now();
  return false;
}

function tjekRotation(){
  if(filPauseAktiv()) return;

  const minutter = minutterNu();
  const erMorgen = minutter >= 540 && minutter < 555;
  const erAften = minutter >= 1230 && minutter < 1290;

  if(erMorgen || erAften){
    const ønsket = erAften ? 'AFTEN' : 'MORGEN';
    const faser = erAften ? aftenFaser : morgenFaser;

    if(rotationTilstand !== ønsket){
      rotationTilstand = ønsket;
      faseIndex = 0;
      faseStart = Date.now();
      visSide(faser[faseIndex].side);
    } else {
      if(Date.now() - faseStart >= faser[faseIndex].varighed){
        faseIndex = (faseIndex + 1) % faser.length;
        faseStart = Date.now();
        visSide(faser[faseIndex].side);
      }
    }
    return;
  }

  if(rotationTilstand !== 'NORMAL'){
    rotationTilstand = 'NORMAL';
    normalIndex = 0;
    visSide(normaleSider[normalIndex]);
    sidsteNormaltSkift = Date.now();
    return;
  }

  const nuværendeVisningstid = normaleVisningstider[normaleSider[normalIndex]] || 30000;
  if(Date.now() - sidsteNormaltSkift >= nuværendeVisningstid){
    normalIndex = (normalIndex + 1) % normaleSider.length;
    visSide(normaleSider[normalIndex]);
    sidsteNormaltSkift = Date.now();
  }
}

// ---- UR ----

function opdaterUr(){
  const nu = new Date();
  const dag = UGEDAGE[nu.getDay()];
  const dato = String(nu.getDate()).padStart(2,'0');
  const måned = String(nu.getMonth()+1).padStart(2,'0');
  const timer = String(nu.getHours()).padStart(2,'0');
  const min = String(nu.getMinutes()).padStart(2,'0');

  document.getElementById('dato').textContent = dag + ' ' + dato + '/' + måned;
  document.getElementById('ur').textContent = timer + ':' + min;
}

// ---- INITIALISER ----

visSide('beskeder');
hentBeskeder();
hentUgeplaner();
opdaterAfkrydsningOverskrift();
opdaterUr();
hentPmoede();
hentSkaermIndstillinger();

// Archivo indlæses asynkront — hvis en kolonne bliver målt/tilpasset FØR
// fonten er klar, sker det med fallback-fontens (smallere) mål, og
// teksten kan blive for stor igen når den rigtige font slår igennem.
// Genmål den aktive fane én gang når webfonten er helt indlæst.
document.fonts.ready.then(function(){
  if(document.getElementById(aktuelSide).classList.contains('active')){
    if(aktuelSide === 'beskeder') tilpasBeskedRækker();
    if(aktuelSide === 'ugeplaner') tilpasAlleKolonner('ugeplanerContainer');
    if(aktuelSide === 'afkrydsning') tilpasAlleKolonner('afkrydsningContainer');
    if(aktuelSide === 'overlap') tilpasAlleKolonner('overlapFarveContainer');
  }
});

// Skærmen/zoom kan skifte efter start — genmål så chips altid passer i rækkerne
let resizeTimer = null;
window.addEventListener('resize', function(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function(){ if(aktuelSide === 'beskeder') tilpasBeskedRækker(); }, 200);
});

setInterval(tjekRotation, 1000);
setInterval(tjekPmoedeSideSkift, 1000);
setInterval(opdaterUr, 1000);
setInterval(opdaterAfkrydsningOverskrift, 60000);

setInterval(() => {
  hentBeskeder();
  hentUgeplaner();
  hentPmoede();
  hentSkaermIndstillinger();
}, 60000);

setInterval(tegnUgeplaner, 60000);

// ---- REALTIME SUBSCRIPTIONS ----
// Kun relevant når klienten faktisk kunne oprettes (se try/catch øverst) —
// uden gyldige nøgler skal skærmen falde tilbage til bare at vise fejlen,
// ikke kaste yderligere exceptions her.

if(sb){

  sb
    .channel('afkrydsning-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'afkrydsninger' }, () => {
      if(aktuelSide === 'afkrydsning') hentAfkrydsningsskema();
    })
    .subscribe();

  sb
    .channel('overlap-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'overlap_farver' }, () => {
      if(aktuelSide === 'overlap') hentOverlap();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'overlap_journal' }, () => {
      if(aktuelSide === 'overlap') hentOverlap();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'overlap_tjekliste' }, () => {
      if(aktuelSide === 'overlap') hentOverlap();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'overlap_dognvagt' }, () => {
      if(aktuelSide === 'overlap') hentOverlap();
    })
    .subscribe();

}
